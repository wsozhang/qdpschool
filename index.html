        // --- Mode Switcher Logic ---
        function setLightingMode(mode) {
            currentMode = mode;

            // Update active button styles mutually exclusively
            const modes = ['realtime', 'day', 'dusk', 'night'];
            modes.forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                if (!btn) return;
                if (m === mode) {
                    btn.className = "mode-btn px-2.5 py-1.5 rounded-xl text-xs font-black transition-all flex items-center gap-1 bg-blue-600 text-white shadow-md scale-105";
                } else {
                    btn.className = "mode-btn px-2.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1 text-slate-700 hover:bg-white/60 hover:scale-105";
                }
            });

            let effectivePresetKey = mode;
            if (mode === 'realtime') {
                const hour = new Date().getHours();
                if (hour >= 6 && hour < 17) {
                    effectivePresetKey = 'day';
                } else if (hour >= 17 && hour < 19) {
                    effectivePresetKey = 'dusk';
                } else {
                    effectivePresetKey = 'night';
                }
            }

            applyLightingPreset(effectivePresetKey, mode === 'realtime');
        }

        function applyLightingPreset(key, isRealtime = false) {
            const preset = lightingPresets[key];
            if (!preset) return;

            if (scene) {
                scene.background.setHex(preset.bg);
                if (scene.fog) scene.fog.color.setHex(preset.fog);
            }

            if (ambientLight) {
                ambientLight.color.setHex(preset.ambientColor);
                ambientLight.intensity = preset.ambientIntensity;
            }

            if (sunLight) {
                sunLight.color.setHex(preset.sunColor);
                sunLight.intensity = preset.sunIntensity;
                sunLight.position.set(...preset.sunPos);
            }

            if (hemiLight) {
                hemiLight.color.setHex(preset.hemiSky);
                hemiLight.groundColor.setHex(preset.hemiGround);
                hemiLight.intensity = preset.hemiIntensity;
            }

            getGlassMat().emissiveIntensity = key === 'night' ? 0.9 : (key === 'dusk' ? 0.35 : 0);
            if (waterMesh && waterMesh.material) {
                waterMesh.material.color.setHex(preset.waterColor);
            }

            // Update UI elements
            const statusTextEl = document.getElementById('weather-status-text');
            const tempTextEl = document.getElementById('weather-temp-text');
            const iconBgEl = document.getElementById('weather-icon-bg');
            const iconSvgEl = document.getElementById('weather-icon-svg');

            if (statusTextEl) {
                statusTextEl.innerText = isRealtime ? `${preset.weatherText} (即時)` : preset.weatherText;
            }
            if (tempTextEl) tempTextEl.innerText = preset.tempText;
            if (iconBgEl) iconBgEl.className = `p-2 rounded-xl flex items-center justify-center ${preset.badgeBg}`;
            if (iconSvgEl) iconSvgEl.innerHTML = preset.iconSvg;
        }

        // --- Walking Character Class (只沿道路 / 橋梁 / 島嶼步道行走) ---
        class Character {
            constructor(node) {
                this.group = new THREE.Group();
                const hue = Math.random();
                const shirt = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(hue, 0.65, 0.58), roughness: 0.55 });
                const pants = new THREE.MeshStandardMaterial({ color: [0x37474F, 0x3F51B5, 0x5D4037, 0x00695C][Math.floor(Math.random() * 4)], roughness: 0.7 });
                const skin = new THREE.MeshStandardMaterial({ color: [0xFFDCC8, 0xF5C6A5, 0xE0AC86, 0xC68E6B][Math.floor(Math.random() * 4)], roughness: 0.5 });
                const hairMat = new THREE.MeshStandardMaterial({ color: [0x2B1B12, 0x3E2723, 0x111111, 0x6D4C41][Math.floor(Math.random() * 4)], roughness: 0.6 });
                const shoeMat = new THREE.MeshStandardMaterial({ color: 0xFAFAFA, roughness: 0.5 });
                const S = (geo, mat) => { const m = new THREE.Mesh(geo, mat); m.castShadow = true; return m; };

                this.body = S(new THREE.CylinderGeometry(0.17, 0.2, 0.5, 14), shirt);
                this.body.position.y = 0.67;
                this.group.add(this.body);

                this.head = new THREE.Group();
                this.head.position.y = 1.08;
                this.head.add(S(new THREE.SphereGeometry(0.2, 18, 14), skin));
                const hair = S(new THREE.SphereGeometry(0.215, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hairMat);
                hair.rotation.x = -0.25; hair.position.y = 0.02;
                this.head.add(hair);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
                [-0.07, 0.07].forEach(ex => {
                    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.024, 8, 8), eyeMat);
                    eye.position.set(ex, 0.0, 0.18);
                    this.head.add(eye);
                });
                this.group.add(this.head);

                const makeLimb = (len, rad, mat, px, py, endMat, endRad) => {
                    const pivot = new THREE.Group();
                    pivot.position.set(px, py, 0);
                    const seg = S(new THREE.CylinderGeometry(rad, rad * 0.9, len, 10), mat);
                    seg.position.y = -len / 2;
                    pivot.add(seg);
                    const end = S(new THREE.SphereGeometry(endRad, 10, 8), endMat);
                    end.position.y = -len;
                    if (endMat === shoeMat) { end.scale.set(1, 0.7, 1.5); end.position.z = 0.04; }
                    pivot.add(end);
                    this.group.add(pivot);
                    return pivot;
                };
                this.leftLeg = makeLimb(0.4, 0.07, pants, -0.09, 0.42, shoeMat, 0.085);
                this.rightLeg = makeLimb(0.4, 0.07, pants, 0.09, 0.42, shoeMat, 0.085);
                this.leftArm = makeLimb(0.34, 0.05, shirt, -0.25, 0.86, skin, 0.055);
                this.rightArm = makeLimb(0.34, 0.05, shirt, 0.25, 0.86, skin, 0.055);

                if (Math.random() < 0.55) {
                    const bag = S(new THREE.BoxGeometry(0.26, 0.3, 0.12), new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL((hue + 0.5) % 1, 0.7, 0.5), roughness: 0.6 }));
                    bag.position.set(0, 0.7, -0.2);
                    this.group.add(bag);
                }

                this.group.scale.setScalar(1.12);
                this.speed = 1.2 + Math.random() * 1.0;   // 單位/秒
                this.walkCycle = Math.random() * 10;
                this.latBase = (Math.random() - 0.5) * 2; // 道路寬度內的左右位置 (-1~1)
                this.lat = 0;
                this.prev = null;
                this.from = node;
                this.isIdle = false; this.idleTimer = 0;
                this.yaw = 0;
                this.pickNext();
                this.group.position.copy(this.posAt(0));
                scene.add(this.group);
            }

            yOf(n) { return n.isl ? n.isl.position.y + 0.78 : n.p.y; }

            pickNext() {
                const nb = this.from.nb;
                let c = nb.filter(e => e.to !== this.prev);
                if (!c.length) c = nb;
                const e = c[Math.floor(Math.random() * c.length)];
                this.to = e.to; this.halfW = e.halfW; this.t = 0;
                const dx = this.to.p.x - this.from.p.x, dz = this.to.p.z - this.from.p.z;
                this.len = Math.max(0.01, Math.hypot(dx, dz));
                this.dirX = dx / this.len; this.dirZ = dz / this.len;
            }

            posAt(t) {
                const a = this.from.p, b = this.to.p;
                const target = this.latBase * this.halfW * 0.8;
                this.lat += (target - this.lat) * 0.08;
                const x = a.x + (b.x - a.x) * t - this.dirZ * this.lat;
                const z = a.z + (b.z - a.z) * t + this.dirX * this.lat;
                const y = this.yOf(this.from) + (this.yOf(this.to) - this.yOf(this.from)) * t;
                return new THREE.Vector3(x, y, z);
            }

            update(dt) {
                if (this.isIdle) {
                    this.idleTimer -= dt;
                    [this.leftLeg, this.rightLeg, this.leftArm, this.rightArm].forEach(p => p.rotation.x *= 0.85);
                    this.body.position.y = 0.67;
                    this.head.rotation.y = Math.sin(this.walkCycle * 0.3 + this.idleTimer) * 0.4;
                    if (this.idleTimer <= 0) { this.isIdle = false; this.head.rotation.y = 0; this.pickNext(); }
                    const p = this.posAt(0); this.group.position.copy(p);
                    return;
                }
                this.t += this.speed * dt / this.len;
                if (this.t >= 1) {
                    this.prev = this.from; this.from = this.to; this.t = 0;
                    const deadEnd = this.from.nb.length === 1;
                    if (deadEnd || Math.random() < 0.04) {
                        this.isIdle = true; this.idleTimer = 1.2 + Math.random() * 2.2;
                        if (deadEnd) this.prev = null;
                        this.to = this.from; this.len = 1;
                        return;
                    }
                    this.pickNext();
                }
                this.group.position.copy(this.posAt(this.t));
                let diff = Math.atan2(this.dirX, this.dirZ) - this.yaw;
                diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                this.yaw += diff * 0.15;
                this.group.rotation.y = this.yaw;

                this.walkCycle += dt * this.speed * 5;
                const sw = Math.sin(this.walkCycle) * 0.6;
                this.leftLeg.rotation.x = sw; this.rightLeg.rotation.x = -sw;
                this.leftArm.rotation.x = -sw * 0.8; this.rightArm.rotation.x = sw * 0.8;
                this.body.position.y = 0.67 + Math.abs(Math.sin(this.walkCycle)) * 0.03;
                this.head.position.y = 1.08 + Math.abs(Math.sin(this.walkCycle)) * 0.03;
            }
        }

        // --- Texture helpers ---
        function makeTex(canvas) {
            const t = new THREE.CanvasTexture(canvas);
            t.anisotropy = 8;
            return t;
        }
        function createGrassTexture(hex) {
            const c = document.createElement('canvas'); c.width = c.height = 256;
            const ctx = c.getContext('2d');
            const base = new THREE.Color(hex);
            ctx.fillStyle = '#' + base.getHexString(); ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 900; i++) {
                const l = base.clone().offsetHSL(0, 0, (Math.random() - 0.5) * 0.12);
                ctx.fillStyle = '#' + l.getHexString();
                ctx.globalAlpha = 0.5;
                ctx.beginPath(); ctx.arc(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 0, 7); ctx.fill();
            }
            ctx.globalAlpha = 1;
            const t = makeTex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 1);
            return t;
        }

            ctx.strokeStyle = '#FFFFFF';

        // --- Door Mesh Generator ---
        function createDoorMesh(width = 1.6, height = 1.5) {
            const g = new THREE.Group();
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x37474F, roughness: 0.45 });
            const frame = new THREE.Mesh(new THREE.BoxGeometry(width + 0.2, height + 0.1, 0.15), frameMat);
            frame.position.y = height / 2; frame.castShadow = true; g.add(frame);

            const glass = getGlassMat();
            [-1, 1].forEach(s => {
                const d = new THREE.Mesh(new THREE.BoxGeometry(width / 2 - 0.06, height - 0.1, 0.08), glass);
                d.position.set(s * width / 4, height / 2, 0.03); g.add(d);
                const h = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.35, 8), new THREE.MeshStandardMaterial({ color: 0xFFD54F, metalness: 0.8, roughness: 0.3 }));
                h.position.set(s * 0.07, height / 2, 0.1); g.add(h);
            });

            // 圓弧形雨遮
            const awning = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, width + 0.6, 20, 1, false, 0, Math.PI),
                new THREE.MeshStandardMaterial({ color: 0x1976D2, roughness: 0.4 }));
            awning.rotation.z = Math.PI / 2; awning.rotation.y = Math.PI / 2;
            awning.scale.set(1, 1, 0.9);
            awning.position.set(0, height + 0.12, 0.28); awning.castShadow = true;
            const awn2 = new THREE.Mesh(new THREE.BoxGeometry(width + 0.6, 0.12, 0.8), new THREE.MeshStandardMaterial({ color: 0x1565C0, roughness: 0.4 }));
            awn2.position.set(0, height + 0.1, 0.3); awn2.castShadow = true; g.add(awn2);
            return g;
        }

        // --- Multi-Story Building Generator ---
        function createMultiStoryBuilding(floors, width, depth, wallColor = 0xF5F5F5, roofColor = 0xD32F2F, hasDoor = true, solarRoof = false) {
            const group = new THREE.Group();
            const fh = 1.8;
            const wallMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.55 });
            const bandMat = new THREE.MeshStandardMaterial({ color: 0xE3DAC9, roughness: 0.6 });
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.5 });
            const roofMat = new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.5 });
            const glass = getGlassMat();
            const add = (m, x, y, z, shadow = true) => { m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; group.add(m); return m; };

            add(new THREE.Mesh(new THREE.BoxGeometry(width + 0.3, 0.3, depth + 0.3), bandMat), 0, 0.15, 0); // 基座
            for (let f = 0; f < floors; f++) {
                const y = f * fh + fh / 2;
                add(new THREE.Mesh(new THREE.BoxGeometry(width, fh, depth), wallMat), 0, y, 0);
                if (f > 0) add(new THREE.Mesh(new THREE.BoxGeometry(width + 0.25, 0.14, depth + 0.25), bandMat), 0, f * fh, 0);

                const n = Math.max(2, Math.floor(width / 1.5)), sp = width / (n + 1);
                for (let i = 1; i <= n; i++) {
                    const wx = -width / 2 + sp * i;
                    if (f === 0 && hasDoor && Math.abs(wx) < 1.3) continue;
                    [1, -1].forEach(side => {
                        const w = new THREE.Group();
                        w.add(new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.98, 0.06), frameMat));
                        const gl = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.82, 0.09), glass); w.add(gl);
                        const sill = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.07, 0.18), frameMat); sill.position.y = -0.52; w.add(sill);
                        w.position.set(wx, y + 0.1, side * (depth / 2 + 0.02));
                        if (side < 0) w.rotation.y = Math.PI;
                        group.add(w);
                    });
                }
            }
            const H = floors * fh;
            add(new THREE.Mesh(new THREE.BoxGeometry(width + 0.6, 0.28, depth + 0.6), roofMat), 0, H + 0.14, 0);
            add(new THREE.Mesh(new THREE.BoxGeometry(width + 0.2, 0.3, depth + 0.2), bandMat), 0, H + 0.42, 0).scale.set(1, 0.6, 1);
            if (solarRoof) addSolarShedRoof(group, width, depth, H + 0.3);
            if (hasDoor) {
                const door = createDoorMesh(1.6, 1.4);

        // --- Smooth Trees (圓冠樹 / 松形樹 / 椰子樹) ---

        function createTree(kind) {
            kind = kind || ['round', 'round', 'pine', 'palm'][Math.floor(Math.random() * 4)];
            const tree = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6D4C41, roughness: 0.9 });
            const crown = new THREE.Group();
            const greens = [0x2E7D32, 0x388E3C, 0x43A047, 0x558B2F];
            const gm = () => new THREE.MeshStandardMaterial({ color: greens[Math.floor(Math.random() * greens.length)], roughness: 0.75 });
            const S = (g, m) => { const x = new THREE.Mesh(g, m); x.castShadow = true; return x; };
            if (kind === 'round') {
                const trunk = S(new THREE.CylinderGeometry(0.12, 0.2, 1.2, 10), trunkMat); trunk.position.y = 0.6; tree.add(trunk);
                [[0, 1.8, 0, 0.95], [0.5, 1.5, 0.2, 0.7], [-0.45, 1.55, -0.2, 0.72], [0.1, 2.25, 0.1, 0.62]].forEach(p => {
                    const b = S(new THREE.IcosahedronGeometry(p[3], 2), gm()); b.position.set(p[0], p[1], p[2]); crown.add(b);
                });
            } else if (kind === 'pine') {
                const trunk = S(new THREE.CylinderGeometry(0.1, 0.18, 1.0, 10), trunkMat); trunk.position.y = 0.5; tree.add(trunk);
                [[1.0, 1.7, 1.3], [0.78, 2.4, 1.2], [0.55, 3.0, 1.0]].forEach(p => {
                    const c = S(new THREE.ConeGeometry(p[0], p[2], 20), gm()); c.position.y = p[1]; crown.add(c);
                });
            } else {
                const tm = new THREE.MeshStandardMaterial({ color: 0x8D6E63, roughness: 0.9 });
                for (let i = 0; i < 6; i++) {
                    const seg = S(new THREE.CylinderGeometry(0.1 - i * 0.008, 0.12 - i * 0.008, 0.55, 8), tm);
                    seg.position.set(i * 0.06, 0.27 + i * 0.52, 0); seg.rotation.z = -0.12; tree.add(seg);
                }
                const lm = new THREE.MeshStandardMaterial({ color: 0x4CAF50, roughness: 0.7, side: THREE.DoubleSide });
                crown.position.set(0.36, 3.2, 0);
                for (let i = 0; i < 8; i++) {
                    const leaf = S(new THREE.SphereGeometry(0.5, 10, 6), lm);
                    leaf.scale.set(1.6, 0.06, 0.32); leaf.position.set(Math.cos(i * 0.785) * 0.75, -0.15, Math.sin(i * 0.785) * 0.75);

                }
                const nut = S(new THREE.SphereGeometry(0.14, 8, 8), new THREE.MeshStandardMaterial({ color: 0x795548 })); nut.position.y = -0.2; crown.add(nut);
            }
            tree.add(crown);
            tree.userData.crown = crown;
            treeList.push({ tree, phase: Math.random() * 6.28 });

        // --- 太陽能光電斜屋頂 (單斜面，後高前低) ---
        let sharedPanelMat = null, sharedPanelFrame = null;
        function getPanelMats() {
            if (!sharedPanelMat) {
                sharedPanelMat = new THREE.MeshStandardMaterial({ color: 0x14306B, roughness: 0.2, metalness: 0.7, emissive: 0x0A1A40, emissiveIntensity: 0.3 });
                sharedPanelFrame = new THREE.MeshStandardMaterial({ color: 0xCFD8DC, metalness: 0.6, roughness: 0.4 });
            }
            return [sharedPanelMat, sharedPanelFrame];
        }
        function addSolarShedRoof(group, width, depth, baseY) {
            const D = depth + 0.4, W = width + 0.3, rise = 1.15, low = 0.08;
            const shape = new THREE.Shape();
            shape.moveTo(-D / 2, 0); shape.lineTo(D / 2, 0); shape.lineTo(D / 2, low); shape.lineTo(-D / 2, rise); shape.closePath();
            const geo = new THREE.ExtrudeGeometry(shape, { depth: W, bevelEnabled: false });
            geo.translate(0, 0, -W / 2);
            const body = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xCFD8DC, roughness: 0.6 }));
            body.rotation.y = -Math.PI / 2; body.position.set(0, baseY, 0); body.castShadow = true; body.receiveShadow = true;
            group.add(body);
            const [pm, pf] = getPanelMats();
            const ang = Math.atan2(rise - low, D), slopeLen = Math.hypot(D, rise - low);
            const pg = new THREE.Group();
            pg.position.set(0, baseY + (rise + low) / 2 + 0.05, 0); pg.rotation.x = ang;
            const aw = W - 0.4, al = slopeLen - 0.2;
            const nx = Math.max(2, Math.floor(aw / 1.3)), ny = Math.max(2, Math.floor(al / 1.1));
            const cw = aw / nx, cl = al / ny;
            const frG = new THREE.BoxGeometry(cw - 0.04, 0.05, cl - 0.04), pnG = new THREE.BoxGeometry(cw - 0.1, 0.06, cl - 0.1);
            for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
                const px = -aw / 2 + (i + 0.5) * cw, pz = -al / 2 + (j + 0.5) * cl;
                const fr = new THREE.Mesh(frG, pf); fr.position.set(px, 0, pz); pg.add(fr);
                const p = new THREE.Mesh(pnG, pm); p.position.set(px, 0.03, pz); p.castShadow = true; pg.add(p);
            }
            group.add(pg);
        }

        // --- 太陽能光電平台屋頂 (球場用，微傾斜 + 支柱) ---
        function addSolarCanopy(g, cx, cz, w, d, topY, tilt) {
            const steel = new THREE.MeshStandardMaterial({ color: 0x78909C, roughness: 0.45, metalness: 0.5 });
            const [pm, pf] = getPanelMats();
            const roof = new THREE.Group(); roof.position.set(cx, topY, cz); roof.rotation.x = tilt; g.add(roof);
            const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 0.4, 0.14, d + 0.4), steel); frame.castShadow = true; frame.receiveShadow = true; roof.add(frame);
            const nx = Math.floor(w / 1.2), ny = Math.floor(d / 1.3), cw = w / nx, cl = d / ny;
            for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
                const px = -w / 2 + (i + 0.5) * cw, pz = -d / 2 + (j + 0.5) * cl;
                const fr = new THREE.Mesh(new THREE.BoxGeometry(cw - 0.04, 0.05, cl - 0.04), pf); fr.position.set(px, 0.1, pz); roof.add(fr);
                const p = new THREE.Mesh(new THREE.BoxGeometry(cw - 0.1, 0.06, cl - 0.1), pm); p.position.set(px, 0.12, pz); p.castShadow = true; roof.add(p);
            }
            [-1, 0, 1].forEach(ix => [-1, 1].forEach(iz => {
                const px = cx + ix * (w / 2), pz = iz * (d / 2);
                const top = topY - pz * Math.sin(tilt) - 0.08, h = top - 0.76;
                const pil = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, h, 12), steel);
                pil.position.set(px, 0.76 + h / 2, cz + pz); pil.castShadow = true; g.add(pil);
            }));
        }

        // --- 涼亭 (六角) ---
        function createGazebo() {
            const g = new THREE.Group();
            const wood = new THREE.MeshStandardMaterial({ color: 0xA1704A, roughness: 0.8 });
            const white = new THREE.MeshStandardMaterial({ color: 0xF5F0E6, roughness: 0.5 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xB23A2E, roughness: 0.6, flatShading: true });
            const S = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; g.add(o); return o; };
            const R = 1.4, PH = 1.9;
            S(new THREE.CylinderGeometry(R + 0.25, R + 0.3, 0.16, 6), new THREE.MeshStandardMaterial({ color: 0xD7CCC8, roughness: 0.8 }), 0, 0.08, 0);

                    while (tries < 40 && (dA(angle, axis) < (data.id === 'kindergarten' ? 1.4 : 0.7) || (data.isTennis && Math.abs(Math.sin(angle)) < 0.6) || (data.isPlayground && dA(angle, 1.95) < 0.55) || (data.isPlayground && Math.abs(Math.atan2(Math.sin(angle + Math.PI / 2), Math.cos(angle + Math.PI / 2))) < 0.7)));

        // --- Wide Connecting Bridge ---
        function createConnectingBridge(x1, y1, z1, x2, y2, z2, subRadius, subId) {
            const g = new THREE.Group();
            const dirH = new THREE.Vector3(x2 - x1, 0, z2 - z1).normalize();
            const pStart = new THREE.Vector3(x1 + dirH.x * MAIN_R, y1 + 0.7, z1 + dirH.z * MAIN_R);
            const pEnd = new THREE.Vector3(x2 - dirH.x * subRadius * 0.85, y2 + 0.7, z2 - dirH.z * subRadius * 0.85);
            const len = pStart.distanceTo(pEnd), mid = pStart.clone().add(pEnd).multiplyScalar(0.5), W = 3.2;
            const dir = pEnd.clone().sub(pStart).normalize();

            const deck = new THREE.Mesh(new THREE.BoxGeometry(W, 0.25, len), new THREE.MeshStandardMaterial({ color: 0xB08968, roughness: 0.75 }));
            deck.position.copy(mid); deck.lookAt(pEnd); deck.castShadow = deck.receiveShadow = true; g.add(deck);

            const white = new THREE.MeshStandardMaterial({ color: 0xF5F0E6, roughness: 0.5 });
            const lampMat = new THREE.MeshStandardMaterial({ color: 0xFFE082, emissive: 0xFFC107, emissiveIntensity: 0.5 });
            const nPost = Math.max(3, Math.round(len / 2.2));
            [-1, 1].forEach(s => {
                const beam = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.34, len), white); beam.position.set(s * W / 2, 0.02, 0); deck.add(beam);
                const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, len, 10), white);
                rail.rotation.x = Math.PI / 2; rail.position.set(s * (W / 2 - 0.05), 0.78, 0); deck.add(rail);
                for (let i = 0; i <= nPost; i++) {
                    const z = -len / 2 + len * i / nPost;
                    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.78, 8), white);
                    post.position.set(s * (W / 2 - 0.05), 0.4, z); post.castShadow = true; deck.add(post);
                    if (i % 2 === 0) {
                        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), lampMat);
                        bulb.position.set(s * (W / 2 - 0.05), 0.92, z); deck.add(bulb);
                    }
                }
            });
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0xCFD8DC, roughness: 0.7 });
            const nP = Math.floor(len / 4);
            for (let i = 1; i <= nP; i++) {
                const p = pStart.clone().add(dir.clone().multiplyScalar(len / (nP + 1) * i));
                const pil = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.38, 5, 16), pillarMat);
                pil.position.set(p.x, p.y - 2.6, p.z); pil.castShadow = true; g.add(pil);
            }
            scene.add(g);
            bridgesInfo.push({ pStart, pEnd, midPoint: mid, length: len, width: W, subId });
        }

        // --- Build Campus Islands Layout + 步行路網 ---
        function buildCampusIslands() {
            bridgesInfo = []; characters = []; islands = []; treeList = []; foamRings = [];
            const mkNode = (x, y, z, isl) => ({ p: new THREE.Vector3(x, y, z), isl, nb: [] });
            const link = (a, b, hw) => { a.nb.push({ to: b, halfW: hw }); b.nb.push({ to: a, halfW: hw }); };

            const mainData = campusData.find(d => d.isMain);
            const mainG = createSingleIsland(mainData, 0, 0, 0);

            // 主島環形道路
            const RN = 72, ring = [];
            for (let i = 0; i < RN; i++) { const a = i / RN * Math.PI * 2; ring.push(mkNode(Math.cos(a) * RING_R, 0, Math.sin(a) * RING_R, mainG)); }
            for (let i = 0; i < RN; i++) link(ring[i], ring[(i + 1) % RN], 0.5);
            const roadRing = new THREE.Mesh(new THREE.RingGeometry(RING_R - 0.9, RING_R + 0.9, 96), new THREE.MeshStandardMaterial({ color: 0xDDD2BE, roughness: 0.85, side: THREE.DoubleSide }));
            roadRing.rotation.x = -Math.PI / 2; roadRing.position.y = 0.785; roadRing.receiveShadow = true; mainG.add(roadRing);
            [[RING_R - 1.05, RING_R - 0.9], [RING_R + 0.9, RING_R + 1.05]].forEach(e => {
                const c = new THREE.Mesh(new THREE.RingGeometry(e[0], e[1], 96), new THREE.MeshStandardMaterial({ color: 0xB9AA92, side: THREE.DoubleSide }));
                c.rotation.x = -Math.PI / 2; c.position.y = 0.78; mainG.add(c);
            });

            const subs = campusData.filter(d => !d.isMain), numSub = subs.length, orbit = 44;
            const bridgeNodes = [], subNodes = {};
            const addFoam = (g, r) => {
                const m = new THREE.Mesh(new THREE.RingGeometry(r + 0.4, r + 1.6, 64), new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }));
                m.rotation.x = -Math.PI / 2; m.position.set(g.position.x, -2.42, g.position.z); scene.add(m);
                foamRings.push({ m, r, phase: Math.random() * 6 });
            };
            addFoam(mainG, mainData.radius);

            subs.forEach((data, index) => {
                const angle = Math.PI / 2 + index / numSub * Math.PI * 2;
                const x = Math.cos(angle) * orbit, z = Math.sin(angle) * orbit, y = Math.sin(index * 1.5) * 0.4;
                const g = createSingleIsland(data, x, y, z);
                addFoam(g, data.radius);
                createConnectingBridge(0, 0, 0, x, y, z, data.radius, data.id);
                const bi = bridgesInfo[bridgesInfo.length - 1];

                const rn = ring[Math.round(angle / (Math.PI * 2) * RN) % RN];
                addDisc(mainG, rn.p.x, rn.p.z, 2.0);
                let prev = rn;
                {   // 主島內部道路：由環形道路通到主島邊緣，再接橋梁
                    const ex = bi.pStart.x - rn.p.x, ez = bi.pStart.z - rn.p.z, m = Math.max(1, Math.ceil(Math.hypot(ex, ez) / 2.5));
                    addRoad(mainG, rn.p.x, rn.p.z, bi.pStart.x, bi.pStart.z, 1.8);
                    for (let k = 1; k <= m; k++) {
                        const nd = mkNode(rn.p.x + ex * k / m, 0, rn.p.z + ez * k / m, mainG);
                        link(prev, nd, 0.8); bridgeNodes.push(nd); prev = nd;
                    }
                }
                const n = Math.max(2, Math.ceil(bi.length / 2.5));
                for (let k = 1; k < n; k++) {
                    const p = bi.pStart.clone().lerp(bi.pEnd, k / n);
                    const node = mkNode(p.x, p.y + 0.125, p.z, null);
                    link(prev, node, 1.0); bridgeNodes.push(node); prev = node;
                }
                const endNode = mkNode(bi.pEnd.x, 0, bi.pEnd.z, g);
                link(prev, endNode, 1.0);

                const r = data.radius, court = data.isPlayground || data.isTennis;
                const u = new THREE.Vector3(-x, 0, -z).normalize(), v = new THREE.Vector3(-u.z, 0, u.x);
                const mine = [endNode];
                addDisc(g, endNode.p.x, endNode.p.z, 1.2);
                if (!court && data.id === 'haiyun') {
                    const q1 = mkNode(x - 4.6, 0, z + 6.4, g), q2 = mkNode(x - 2.5, 0, z + 7.3, g);
                    const p1 = mkNode(x + 0.4, 0, z + 6.7, g), p2 = mkNode(x + 6.0, 0, z + 3.45, g), p3 = mkNode(x + 5.9, 0, z - 2.2, g);
                    link(endNode, q1, 0.45); link(q1, q2, 0.45); link(q2, p1, 0.45); link(p1, p2, 0.45); link(p2, p3, 0.45);
                    addRoad(g, endNode.p.x, endNode.p.z, q1.p.x, q1.p.z, 1.2);
                    addRoad(g, q1.p.x, q1.p.z, q2.p.x, q2.p.z, 1.2);
                    addRoad(g, q2.p.x, q2.p.z, p1.p.x, p1.p.z, 1.2);
                    addRoad(g, p1.p.x, p1.p.z, p2.p.x, p2.p.z, 1.2);
                    addRoad(g, p2.p.x, p2.p.z, p3.p.x, p3.p.z, 1.2);
                    mine.push(q1, q2, p1, p2, p3);
                } else if (!court) {
                    const pp = new THREE.Vector3(x, 0, z).addScaledVector(u, r * 0.66);
                    const plaza = mkNode(pp.x, 0, pp.z, g);
                    const lat = data.id === 'kindergarten' ? 0.8 : 1.9;
                    const sl = mkNode(pp.x + v.x * lat, 0, pp.z + v.z * lat, g), sr = mkNode(pp.x - v.x * lat, 0, pp.z - v.z * lat, g);
                    link(endNode, plaza, 0.45); link(plaza, sl, 0.4); link(plaza, sr, 0.4);
                    addRoad(g, endNode.p.x, endNode.p.z, pp.x, pp.z, 1.6);
                    addRoad(g, sl.p.x, sl.p.z, sr.p.x, sr.p.z, 1.3);
                    addDisc(g, pp.x, pp.z, 1.0);
                    mine.push(plaza, sl, sr);
                } else if (data.isPlayground) {
                    const L = (cx, cy) => [x + (cx / 512 - 0.5) * 17.6, z + (cy / 326 - 0.5) * 11.2];
                    const nd = (cx, cy) => { const p = L(cx, cy); return mkNode(p[0], 0, p[1], g); };
                    const X0 = 25, X1 = 487, Y0 = 25, Y1 = 301, RR = 81, pts0 = [];
                    [[X0 + RR, Y0 + RR, Math.PI, 1.5 * Math.PI], [X1 - RR, Y0 + RR, 1.5 * Math.PI, 2 * Math.PI], [X1 - RR, Y1 - RR, 0, 0.5 * Math.PI], [X0 + RR, Y1 - RR, 0.5 * Math.PI, Math.PI]].forEach(a => {
                        for (let k = 0; k <= 6; k++) { const t = a[2] + (a[3] - a[2]) * k / 6; pts0.push([a[0] + RR * Math.cos(t), a[1] + RR * Math.sin(t)]); }
                    });
                    const pts = [];
                    pts0.forEach((p, i) => {
                        const q = pts0[(i + 1) % pts0.length]; pts.push(p);
                        const m = Math.floor(Math.hypot(q[0] - p[0], q[1] - p[1]) / 62);
                        for (let k = 1; k <= m; k++) pts.push([p[0] + (q[0] - p[0]) * k / (m + 1), p[1] + (q[1] - p[1]) * k / (m + 1)]);
                    });
                    const trk = pts.map(p => { const w = L(p[0], p[1]); return mkNode(w[0], 0, w[1], g); });
                    trk.forEach((n, i) => link(n, trk[(i + 1) % trk.length], 0.45));
                    const near = (p, arr) => arr.reduce((b, n) => Math.hypot(n.p.x - p.x, n.p.z - p.z) < Math.hypot(b.p.x - p.x, b.p.z - p.z) ? n : b, arr[0]);
                    const tn = near(endNode.p, trk);
                    link(endNode, tn, 0.5);
                    addRoad(g, endNode.p.x, endNode.p.z, endNode.p.x + (tn.p.x - endNode.p.x) * 0.5, endNode.p.z + (tn.p.z - endNode.p.z) * 0.5, 1.6);
                    // 光電球場 (內場左側)
                    const E = nd(242, 163), C = nd(146, 163), N = nd(100, 135), S = nd(100, 190);
                    // 足球場 (內場右側)
                    const P1 = nd(300, 163), PC = nd(359, 163), P2 = nd(359, 115), P3 = nd(359, 211), P4 = nd(416, 163);
                    link(E, C, 0.4); link(C, N, 0.4); link(C, S, 0.4);
                    link(E, P1, 0.45); link(P1, PC, 0.45); link(PC, P4, 0.45); link(PC, P2, 0.45); link(PC, P3, 0.45);
                    link(near(P4.p, trk), P4, 0.5);
                    // 司令台前方步道
                    const Pn = mkNode(x, 0, z - 5.9, g);
                    link(near(Pn.p, trk), Pn, 0.4);
                    addDisc(g, x, z - 6.0, 0.9);
                    mine.push(...trk, E, C, N, S, P1, PC, P2, P3, P4, Pn);
                } else {
                    // 兩座球場之間的走道
                    const c = mkNode(x, 0, z, g), g1 = mkNode(x, 0, z + 5.0, g), g2 = mkNode(x, 0, z - 5.0, g);
                    link(endNode, g1, 0.5); link(g1, c, 0.4); link(c, g2, 0.4);
                    addRoad(g, endNode.p.x, endNode.p.z, x, z + 5.0, 1.2);
                    addRoad(g, x, z + 5.0, x, z - 5.0, 0.8);
                    mine.push(c, g1, g2);
                }
                subNodes[data.id] = mine;
            });

            // 人物只出現在 道路 / 橋梁 / 島嶼步道 節點上，並沿路網行走
            const pick = arr => arr[Math.floor(Math.random() * arr.length)];
            for (let i = 0; i < 8; i++) characters.push(new Character(pick(ring)));
            Object.values(subNodes).forEach(arr => { for (let i = 0; i < 2; i++) characters.push(new Character(pick(arr))); });
            for (let i = 0; i < 12; i++) characters.push(new Character(pick(bridgeNodes)));
        }

        // --- Lighting ---
        function setupLighting() {
            ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.65);
            scene.add(ambientLight);

            sunLight = new THREE.DirectionalLight(0xFFF5E6, 0.9);
            sunLight.position.set(40, 60, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 180;
            sunLight.shadow.bias = -0.0006;
            sunLight.shadow.radius = 3;
            const d = 78;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x388E3C, 0.35);
            scene.add(hemiLight);
        }

        // --- Dynamic Water Ocean ---
        function createOcean() {
            const waterGeo = new THREE.PlaneGeometry(300, 300, 64, 64);
            const waterMat = new THREE.MeshStandardMaterial({ color: 0x29B6F6, roughness: 0.15, metalness: 0.25, transparent: true, opacity: 0.88 });
            waterMesh = new THREE.Mesh(waterGeo, waterMat);
            waterMesh.rotation.x = -Math.PI / 2;
            waterMesh.position.y = -2.5;
            waterMesh.receiveShadow = true;
            scene.add(waterMesh);
        }

        // --- Fluffy Clouds ---
        function createClouds() {
            cloudsGroup = new THREE.Group();
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 1, transparent: true, opacity: 0.92, emissive: 0x333344, emissiveIntensity: 0.25 });
            for (let i = 0; i < 18; i++) {
                const cloud = new THREE.Group();
                const num = 5 + Math.floor(Math.random() * 3);
                for (let j = 0; j < num; j++) {
                    const t = j / (num - 1) - 0.5;
                    const rad = 1.3 + (1 - Math.abs(t) * 1.6) * 1.1 + Math.random() * 0.4;
                    const puff = new THREE.Mesh(new THREE.SphereGeometry(rad, 18, 14), cloudMat);
                    puff.scale.set(1, 0.7, 0.9);
                    puff.position.set(t * 6, (1 - Math.abs(t) * 2) * 0.7, (Math.random() - 0.5) * 1.2);
                    cloud.add(puff);
                }
                const angle = (i / 18) * Math.PI * 2, dist = 35 + Math.random() * 45;
                cloud.position.set(Math.cos(angle) * dist, 16 + Math.random() * 8, Math.sin(angle) * dist);
                cloud.rotation.y = Math.random() * 6; cloud.userData.phase = Math.random() * 6;
                cloudsGroup.add(cloud);
            }
            scene.add(cloudsGroup);
        }

        // --- Interaction Handlers ---
        function onPointerDown(event) {
            if (event.target !== renderer.domElement) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            for (let i = 0; i < intersects.length; i++) {
                let obj = intersects[i].object;
                while (obj && !obj.userData.id && obj.parent) {
                    obj = obj.parent;
                }
                if (obj && obj.userData && obj.userData.id) {
                    openModal(obj.userData.id);
                    break;
                }
            }
        }

        function onPointerMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            let hoveredIslandId = null;
            for (let i = 0; i < intersects.length; i++) {
                let obj = intersects[i].object;
                while (obj && !obj.userData.id && obj.parent) {
                    obj = obj.parent;
                }
                if (obj && obj.userData && obj.userData.id) {
                    hoveredIslandId = obj.userData.id;
                    break;
                }
            }

            islands.forEach(island => {
                if (island.userData.id === hoveredIslandId) {
                    island.userData.targetScale = 1.04;
                } else {
                    island.userData.targetScale = 1.0;
                }
            });

            document.body.style.cursor = hoveredIslandId ? 'pointer' : 'default';
        }

        // --- Modal Dialog Functions ---
        function openModal(islandId) {
            const data = campusData.find(d => d.id === islandId);
            if (!data) return;

            document.getElementById('modal-title').innerText = data.name;
            document.getElementById('modal-desc').innerText = data.desc;

            // Handle direct link for island title (e.g. 幼兒園)
            const titleLinkContainer = document.getElementById('modal-title-link');
            const islandUrl = officeLinks[data.name] || officeLinks[data.name.replace(/\s*\(.*?\)/g, '')];
            if (islandUrl) {
                titleLinkContainer.innerHTML = `
                    <a href="${islandUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-xs font-bold rounded-xl shadow-md hover:shadow-lg transition-all hover:scale-105">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                        <span>前往專頁 ↗</span>
                    </a>
                `;
            } else {
                titleLinkContainer.innerHTML = '';
            }

            const facilitiesContainer = document.getElementById('modal-facilities');
            facilitiesContainer.innerHTML = '';

            if (data.facilities) {
                Object.entries(data.facilities).forEach(([category, items]) => {
                    const catTitle = document.createElement('div');
                    catTitle.className = 'col-span-full font-bold text-xs text-blue-700 bg-blue-100/70 px-3 py-1 rounded-lg mt-1';
                    catTitle.innerText = category;
                    facilitiesContainer.appendChild(catTitle);

                    items.forEach(item => {
                        const linkUrl = officeLinks[item];
                        if (linkUrl) {
                            const linkCard = document.createElement('a');
                            linkCard.href = linkUrl;
                            linkCard.target = '_blank';
                            linkCard.rel = 'noopener noreferrer';
                            linkCard.className = 'p-2.5 bg-gradient-to-r from-blue-50 to-indigo-50 hover:from-blue-100 hover:to-indigo-100 rounded-xl border border-blue-300 shadow-sm flex items-center justify-between text-xs md:text-sm text-blue-900 font-bold transition-all hover:scale-[1.02] hover:shadow-md group';
                            linkCard.innerHTML = `
                                <div class="flex items-center space-x-2">
                                    <span class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></span>
                                    <span>${item}</span>
                                </div>
                                <span class="inline-flex items-center gap-1 text-xs text-blue-600 group-hover:text-blue-800 font-extrabold bg-white/80 px-2 py-0.5 rounded-md border border-blue-200">
                                    前往網頁 ↗
                                </span>
                            `;
                            facilitiesContainer.appendChild(linkCard);
                        } else {
                            const itemCard = document.createElement('div');
                            itemCard.className = 'p-2.5 bg-white/80 rounded-xl border border-slate-200/80 shadow-sm flex items-center space-x-2 text-xs md:text-sm text-slate-800 font-medium hover:bg-blue-50 transition-colors';
                            itemCard.innerHTML = `
                                <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                                <span>${item}</span>
                            `;
                            facilitiesContainer.appendChild(itemCard);
                        }
                    });
                });
            }

            const modal = document.getElementById('info-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.children[0].classList.remove('scale-95');
            modal.children[0].classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('info-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.children[0].classList.remove('scale-100');
            modal.children[0].classList.add('scale-95');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Main Scene Initialization ---
        function init() {
            const dateEl = document.getElementById('current-date');
            const now = new Date();
            const daysOfWeek = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dayName = daysOfWeek[now.getDay()];
            dateEl.innerText = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} (${dayName})`;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.006);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 62, 98);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.05;
            controls.minDistance = 15;
            controls.maxDistance = 200;
            controls.target.set(0, 0, 0);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            labelsContainer = document.getElementById('labels-container');

            setupLighting();
            createOcean();
            createClouds();
            buildCampusIslands();

            setLightingMode('realtime');

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);

            document.getElementById('close-modal').addEventListener('click', closeModal);
            document.getElementById('modal-ok-btn').addEventListener('click', closeModal);

            animate();
        }

        // --- Render Loop ---
        const clock = new THREE.Clock();
        let lastT = 0;
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            swingList.forEach(s => { s.rotation.x = Math.sin(elapsedTime * 1.6 + s.userData.ph) * 0.35; });

            controls.update();

            if (waterMesh) {
                const pos = waterMesh.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const u = pos.getX(i);
                    const v = pos.getY(i);
                    const z = Math.sin(elapsedTime * 1.5 + u * 0.2) * 0.25 + Math.cos(elapsedTime * 1.2 + v * 0.2) * 0.25;
                    pos.setZ(i, z);
                }
                waterMesh.geometry.computeVertexNormals();
                waterMesh.geometry.attributes.position.needsUpdate = true;
            }

            if (cloudsGroup) {
                cloudsGroup.rotation.y = elapsedTime * 0.02;
            }

            islands.forEach(group => {
                const off = group.userData.floatOffset;
                group.position.y = group.userData.baseY + Math.sin(elapsedTime * 1.2 + off) * 0.1;

                group.userData.currentScale += (group.userData.targetScale - group.userData.currentScale) * 0.1;
                group.scale.setScalar(group.userData.currentScale);

                if (group.userData.labelEl) {
                    const worldPos = group.position.clone();
                    worldPos.y += group.userData.radius * 0.35 + 3.8;

                    const camSpacePos = worldPos.clone().applyMatrix4(camera.matrixWorldInverse);
                    const labelEl = group.userData.labelEl;

                    if (camSpacePos.z < 0) {
                        const ndc = worldPos.clone().project(camera);

                        if (ndc.x >= -1.1 && ndc.x <= 1.1 && ndc.y >= -1.1 && ndc.y <= 1.1) {
                            const x = (ndc.x * 0.5 + 0.5) * window.innerWidth;
                            const y = (-(ndc.y * 0.5) + 0.5) * window.innerHeight;

                            labelEl.style.display = 'flex';
                            labelEl.style.left = `${x}px`;
                            labelEl.style.top = `${y}px`;
                            labelEl.style.opacity = '1';
                        } else {
                            labelEl.style.display = 'none';
                        }
                    } else {
                        labelEl.style.display = 'none';
                    }
                }
            });

            const dt = Math.min(elapsedTime - lastT, 0.05); lastT = elapsedTime;
            characters.forEach(char => char.update(dt));
            treeList.forEach(o => { const c = o.tree.userData.crown; if (c) { c.rotation.z = Math.sin(elapsedTime * 0.9 + o.phase) * 0.025; c.rotation.x = Math.cos(elapsedTime * 0.7 + o.phase) * 0.015; } });
            foamRings.forEach(f => { const s = 1 + Math.sin(elapsedTime * 1.4 + f.phase) * 0.035; f.m.scale.set(s, s, 1); f.m.material.opacity = 0.28 + Math.sin(elapsedTime * 1.4 + f.phase) * 0.1; });
            if (cloudsGroup) cloudsGroup.children.forEach(c => { c.position.y += Math.sin(elapsedTime * 0.4 + c.userData.phase) * 0.003; });

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
