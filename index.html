                    btn.className = "mode-btn px-2.5 py-1.5 rounded-xl text-xs font-black transition-all flex items-center gap-1 bg-blue-600 text-white shadow-md scale-105";
                } else {
                    btn.className = "mode-btn px-2.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1 text-slate-700 hover:bg-white/60 hover:scale-105";
                }
            });

            let effectivePresetKey = mode;
            if (mode === 'realtime') {
                const hour = new Date().getHours();
                if (hour >= 6 && hour < 17) {
                    effectivePresetKey = 'day';
                } else if (hour >= 17 && hour < 19) {
                    effectivePresetKey = 'dusk';
                } else {
                    effectivePresetKey = 'night';
                }
            }

            applyLightingPreset(effectivePresetKey, mode === 'realtime');
        }

        function applyLightingPreset(key, isRealtime = false) {
            const preset = lightingPresets[key];
            if (!preset) return;

            if (scene) {
                scene.background.setHex(preset.bg);
                if (scene.fog) scene.fog.color.setHex(preset.fog);
            }

            if (ambientLight) {
                ambientLight.color.setHex(preset.ambientColor);
                ambientLight.intensity = preset.ambientIntensity;
            }

            if (sunLight) {
                sunLight.color.setHex(preset.sunColor);
                sunLight.intensity = preset.sunIntensity;
                sunLight.position.set(...preset.sunPos);
            }

            if (hemiLight) {
                hemiLight.color.setHex(preset.hemiSky);
                hemiLight.groundColor.setHex(preset.hemiGround);
                hemiLight.intensity = preset.hemiIntensity;
            }

            if (waterMesh && waterMesh.material) {
                waterMesh.material.color.setHex(preset.waterColor);
            }

            // Update UI elements
            const statusTextEl = document.getElementById('weather-status-text');
            const tempTextEl = document.getElementById('weather-temp-text');
            const iconBgEl = document.getElementById('weather-icon-bg');
            const iconSvgEl = document.getElementById('weather-icon-svg');

            if (statusTextEl) {
                statusTextEl.innerText = isRealtime ? `${preset.weatherText} (即時)` : preset.weatherText;
            }
            if (tempTextEl) tempTextEl.innerText = preset.tempText;
            if (iconBgEl) iconBgEl.className = `p-2 rounded-xl flex items-center justify-center ${preset.badgeBg}`;
            if (iconSvgEl) iconSvgEl.innerHTML = preset.iconSvg;
        }

        // --- Walking Character Class ---
        class Character {
            constructor(startPos, isBridgeWalker = false) {
                this.group = new THREE.Group();
                
                const shirtColor = new THREE.Color().setHSL(Math.random(), 0.85, 0.55);
                const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5, flatShading: true });
                const pantsMat = new THREE.MeshStandardMaterial({ color: 0x263238, roughness: 0.6 });
                const skinMat = new THREE.MeshStandardMaterial({ color: 0xFFCCBC, roughness: 0.4, flatShading: true });

                // Torso
                this.body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.25), shirtMat);
                this.body.position.y = 0.65;
                this.body.castShadow = true;
                this.group.add(this.body);

                // Head
                const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.22, 0), skinMat);
                head.position.y = 1.05;
                head.castShadow = true;
                this.group.add(head);

                // Hair / Cap
                const hair = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.1, 0.25), new THREE.MeshStandardMaterial({ color: 0x3E2723 }));
                hair.position.y = 1.22;
                this.group.add(hair);

                // Legs
                const legGeo = new THREE.BoxGeometry(0.12, 0.4, 0.12);
                this.leftLeg = new THREE.Mesh(legGeo, pantsMat);
                this.leftLeg.position.set(-0.1, 0.2, 0);
                this.leftLeg.castShadow = true;
                this.group.add(this.leftLeg);

                this.rightLeg = new THREE.Mesh(legGeo, pantsMat);
                this.rightLeg.position.set(0.1, 0.2, 0);
                this.rightLeg.castShadow = true;
                this.group.add(this.rightLeg);

                // Arms
                const armGeo = new THREE.BoxGeometry(0.1, 0.38, 0.1);
                this.leftArm = new THREE.Mesh(armGeo, shirtMat);
                this.leftArm.position.set(-0.27, 0.6, 0);
                this.group.add(this.leftArm);

                this.rightArm = new THREE.Mesh(armGeo, shirtMat);
                this.rightArm.position.set(0.27, 0.6, 0);
                this.group.add(this.rightArm);

                this.isBridgeWalker = isBridgeWalker;
                this.group.position.copy(startPos);

                this.target = new THREE.Vector3();
                this.speed = 0.02 + Math.random() * 0.02;
                this.walkCycle = Math.random() * 100;
                this.isIdle = false;
                this.idleTimer = 0;

                if (this.isBridgeWalker && bridgesInfo.length > 0) {
                    this.bridge = bridgesInfo[Math.floor(Math.random() * bridgesInfo.length)];
                    this.bridgeDir = Math.random() > 0.5 ? 1 : -1;
                    this.lateralOffset = (Math.random() - 0.5) * (this.bridge.width - 0.8);
                    this.setBridgeTarget();
                } else {
                    this.homePos = startPos.clone();
                    this.radius = 4.5;
                    this.pickIslandTarget();
                }

                scene.add(this.group);
            }

            setBridgeTarget() {
                if (!this.bridge) return;
                const endPt = this.bridgeDir === 1 ? this.bridge.pEnd.clone() : this.bridge.pStart.clone();
                const bDir = this.bridge.pEnd.clone().sub(this.bridge.pStart).normalize();
                const perp = new THREE.Vector3(-bDir.z, 0, bDir.x).multiplyScalar(this.lateralOffset);
                this.target = endPt.add(perp);
                this.target.y = 0.75;
            }

            pickIslandTarget() {
                const a = Math.random() * Math.PI * 2;
                const d = Math.random() * this.radius;
                this.target.set(this.homePos.x + Math.cos(a) * d, 0.75, this.homePos.z + Math.sin(a) * d);
            }

            update(time) {
                if (this.isIdle) {
                    this.idleTimer -= 0.016;
                    this.leftLeg.rotation.x = 0;
                    this.rightLeg.rotation.x = 0;
                    this.leftArm.rotation.x = 0;
                    this.rightArm.rotation.x = 0;
                    if (this.idleTimer <= 0) {
                        this.isIdle = false;
                        if (this.isBridgeWalker) {
                            this.bridgeDir *= -1;
                            if (Math.random() < 0.35 && bridgesInfo.length > 1) {
                                this.bridge = bridgesInfo[Math.floor(Math.random() * bridgesInfo.length)];
                                this.lateralOffset = (Math.random() - 0.5) * (this.bridge.width - 0.8);
                            }
                            this.setBridgeTarget();
                        } else {
                            this.pickIslandTarget();
                        }
                    }
                    return;
                }

                const dir = this.target.clone().sub(this.group.position);
                dir.y = 0;
                
                if (dir.length() < 0.5) {
                    this.isIdle = true;
                    this.idleTimer = 1 + Math.random() * 2.0;
                } else {
                    dir.normalize();
                    this.group.position.add(dir.clone().multiplyScalar(this.speed));
                    const lookTarget = this.group.position.clone().add(dir);
                    this.group.lookAt(lookTarget);

                    this.walkCycle += 0.15;
                    const swing = Math.sin(this.walkCycle) * 0.6;
                    this.leftLeg.rotation.x = swing;
                    this.rightLeg.rotation.x = -swing;
                    this.leftArm.rotation.x = -swing;
                    this.rightArm.rotation.x = swing;
                }
            }
        }

        // --- Texture Generation Functions ---
        function createTennisCourtTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#2A6888';
            ctx.fillRect(0, 0, 512, 256);
            ctx.fillStyle = '#3B8256';
            ctx.fillRect(32, 32, 448, 192);
            
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 4;
            ctx.strokeRect(32, 32, 448, 192);
            ctx.strokeRect(64, 32, 384, 192);
            
            ctx.beginPath();
            ctx.moveTo(256, 32); ctx.lineTo(256, 224);
            ctx.moveTo(128, 64); ctx.lineTo(128, 192);
            ctx.moveTo(384, 64); ctx.lineTo(384, 192);
            ctx.moveTo(128, 128); ctx.lineTo(384, 128);
            ctx.stroke();
            
            return new THREE.CanvasTexture(canvas);
        }

        function createPlaygroundTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#66BB6A';
            ctx.fillRect(0, 0, 512, 300);
            
            // Left: Basketball court
            ctx.fillStyle = '#1E88E5';
            ctx.fillRect(20, 20, 220, 260);
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 3;
            ctx.strokeRect(20, 20, 220, 260);
            
            ctx.beginPath();
            ctx.moveTo(130, 20); ctx.lineTo(130, 280);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(130, 150, 40, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.strokeRect(20, 100, 50, 100);
            ctx.beginPath(); ctx.arc(70, 150, 30, -Math.PI/2, Math.PI/2); ctx.stroke();
            ctx.strokeRect(190, 100, 50, 100);
            ctx.beginPath(); ctx.arc(190, 150, 30, Math.PI/2, -Math.PI/2); ctx.stroke();
            
            // Right: Oval Track
            ctx.fillStyle = '#D84315';
            ctx.beginPath();
            ctx.roundRect(260, 30, 230, 240, [100]);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#FFFFFF';
            ctx.stroke();
            
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.roundRect(290, 60, 170, 180, [80]);
            ctx.fill();
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        // --- Door Mesh Generator ---
        function createDoorMesh(width = 1.6, height = 1.5) {
            const doorGroup = new THREE.Group();
            
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.5 });
            const frame = new THREE.Mesh(new THREE.BoxGeometry(width + 0.2, height + 0.1, 0.15), frameMat);
            frame.position.y = height / 2;
            frame.castShadow = true;
            doorGroup.add(frame);

            const glassMat = new THREE.MeshStandardMaterial({ color: 0x80DEEA, roughness: 0.1, transparent: true, opacity: 0.75 });
            const leftDoor = new THREE.Mesh(new THREE.BoxGeometry(width / 2 - 0.05, height - 0.1, 0.08), glassMat);
            leftDoor.position.set(-width / 4, height / 2, 0.02);
            doorGroup.add(leftDoor);

            const rightDoor = leftDoor.clone();
            rightDoor.position.x = width / 4;
            doorGroup.add(rightDoor);

            const handleMat = new THREE.MeshStandardMaterial({ color: 0xFFD54F, roughness: 0.3, metalness: 0.8 });
            const handleLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3), handleMat);
            handleLeft.position.set(-0.06, height / 2, 0.08);
            doorGroup.add(handleLeft);

            handleRight.position.x = 0.06;

            const awningMat = new THREE.MeshStandardMaterial({ color: 0x1565C0, flatShading: true });

            awning.position.set(0, height + 0.1, 0.25);
            awning.castShadow = true;
            doorGroup.add(awning);

            return doorGroup;
        }

        // --- Multi-Story Building Generator ---
        function createMultiStoryBuilding(floors, width, depth, wallColor = 0xF5F5F5, roofColor = 0xD32F2F, hasDoor = true) {
            const group = new THREE.Group();
            const floorHeight = 1.8;
            const wallMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.4, flatShading: true });
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x37474F, roughness: 0.2 });
            const ledgeMat = new THREE.MeshStandardMaterial({ color: 0xE0E0E0, flatShading: true });
            const roofMat = new THREE.MeshStandardMaterial({ color: roofColor, flatShading: true });

            for (let f = 0; f < floors; f++) {
                const floorY = f * floorHeight + floorHeight / 2;
                
                const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(width, floorHeight, depth), wallMat);
                floorMesh.position.y = floorY;
                floorMesh.castShadow = true;
                floorMesh.receiveShadow = true;
                group.add(floorMesh);

                if (f > 0) {
                    const ledge = new THREE.Mesh(new THREE.BoxGeometry(width + 0.2, 0.15, depth + 0.2), ledgeMat);
                    ledge.position.y = f * floorHeight;
                    group.add(ledge);
                }

                const numWindows = Math.max(2, Math.floor(width / 1.5));
                const winWidth = 0.8;
                const winHeight = 0.8;
                const spacing = width / (numWindows + 1);

                for (let i = 1; i <= numWindows; i++) {
                    const winX = -width / 2 + spacing * i;
                    
                    if (f > 0 || !hasDoor || Math.abs(winX) > 1.2) {
                        const winFront = new THREE.Mesh(new THREE.PlaneGeometry(winWidth, winHeight), windowMat);
                        winFront.position.set(winX, floorY, depth / 2 + 0.02);
                        group.add(winFront);

                        const winBack = new THREE.Mesh(new THREE.PlaneGeometry(winWidth, winHeight), windowMat);
                        winBack.position.set(winX, floorY, -depth / 2 - 0.02);
                        winBack.rotation.y = Math.PI;
                        group.add(winBack);
                    }
                }
            }

            const totalHeight = floors * floorHeight;
            const roof = new THREE.Mesh(new THREE.BoxGeometry(width + 0.4, 0.3, depth + 0.4), roofMat);
            roof.position.y = totalHeight + 0.15;
            roof.castShadow = true;
            group.add(roof);

            if (hasDoor) {
                const door = createDoorMesh(1.6, 1.4);
                door.position.set(0, 0, depth / 2 + 0.01);
                group.add(door);
            }

            return group;
        }

            // Pectoral Fins (Pair)
            const pectoralFinGroupL = new THREE.Group();
            pectoralFinGroupL.position.set(-0.32, 0.52, 0.12);
            pectoralFinGroupL.rotation.set(-Math.PI / 6, -Math.PI / 4, -Math.PI / 4);

            pecFinL.scale.set(0.08, 1.0, 1.3);
            pecFinL.castShadow = true;
            pectoralFinGroupL.add(pecFinL);
            carpGroup.add(pectoralFinGroupL);

            const pectoralFinGroupR = new THREE.Group();
            pectoralFinGroupR.position.set(0.32, 0.52, 0.12);
            pectoralFinGroupR.rotation.set(-Math.PI / 6, Math.PI / 4, Math.PI / 4);

            const pecFinR = pecFinL.clone();
            pectoralFinGroupR.add(pecFinR);
            carpGroup.add(pectoralFinGroupR);

            // Pelvic Fins
            const pelvicFinL = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.38, 3), finMat);
            pelvicFinL.scale.set(0.06, 1.0, 1.0);
            pelvicFinL.position.set(-0.16, 0.22, 0.15);
            pelvicFinL.rotation.set(Math.PI / 4, -Math.PI / 6, -Math.PI / 6);

            pelvicFinR.position.x = 0.16;
            pelvicFinR.rotation.set(Math.PI / 4, Math.PI / 6, Math.PI / 6);
            carpGroup.add(pelvicFinR);

            // Dorsal Fin Crest
            const dorsalFinGroup = new THREE.Group();
            dorsalFinGroup.position.set(0, 0.65, -0.15);
            dorsalFinGroup.rotation.x = -Math.PI / 8;

            const dorsalMain = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.35, 0.55), finMat);
            dorsalMain.position.set(0, 0.18, 0);
            dorsalMain.castShadow = true;
            dorsalFinGroup.add(dorsalMain);

            const dorsalSpine = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.4, 4), carpGoldMat);
            dorsalSpine.position.set(0, 0.2, 0.22);
            dorsalSpine.rotation.x = -Math.PI / 6;
            dorsalFinGroup.add(dorsalSpine);

            carpGroup.add(dorsalFinGroup);

            // Double-Lobed Tail Fin
            const tailFinGroup = new THREE.Group();
            tailFinGroup.position.set(0, -0.38, -0.52);
            tailFinGroup.rotation.x = Math.PI / 2.5;

            const tailUpperLobe = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.65, 4), finMat);
            tailUpperLobe.scale.set(0.08, 1.0, 1.2);
            tailUpperLobe.position.set(0, 0.25, -0.1);
            tailUpperLobe.rotation.x = -Math.PI / 6;
            tailUpperLobe.castShadow = true;
            tailFinGroup.add(tailUpperLobe);

            const tailLowerLobe = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.55, 4), finMat);
            tailLowerLobe.scale.set(0.08, 1.0, 1.1);
            tailLowerLobe.position.set(0, -0.18, -0.05);
            tailLowerLobe.rotation.x = Math.PI / 6;
            tailLowerLobe.castShadow = true;
            tailFinGroup.add(tailLowerLobe);

            const tailTrim = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.02, 6, 12), carpGoldMat);
            tailTrim.position.set(0, 0.05, -0.15);
            tailTrim.rotation.y = Math.PI / 2;
            tailFinGroup.add(tailTrim);

            carpGroup.add(tailFinGroup);

            // 4. Dynamic Water Splash Spray
            const splashMat = new THREE.MeshStandardMaterial({ color: 0xE0F7FA, transparent: true, opacity: 0.8, flatShading: true });
            for (let i = 0; i < 8; i++) {
                const splashAngle = (i / 8) * Math.PI * 2;
                const dist = 0.38 + (i % 2) * 0.12;
                const splash = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.32, 5), splashMat);
                splash.position.set(Math.cos(splashAngle) * dist, -0.35, Math.sin(splashAngle) * dist - 0.1);
                splash.rotation.x = Math.cos(splashAngle) * 0.4;
                splash.rotation.z = Math.sin(splashAngle) * 0.4;
                carpGroup.add(splash);

                const drop = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), jetMat);
                drop.position.set(Math.cos(splashAngle) * (dist + 0.15), -0.2 + (i % 3) * 0.08, Math.sin(splashAngle) * (dist + 0.15) - 0.1);
                carpGroup.add(drop);
            }

            poolGroup.add(carpGroup);
            return poolGroup;
        }

        // --- Wide Connecting Bridge ---
        function createConnectingBridge(x1, y1, z1, x2, y2, z2, subRadius, subId) {
            const bridgeGroup = new THREE.Group();
            
            const start = new THREE.Vector3(x1, y1 + 0.7, z1);
            const end = new THREE.Vector3(x2, y2 + 0.7, z2);
            
            const dir = end.clone().sub(start);
            dir.normalize();
            
            const pStart = start.clone().add(dir.clone().multiplyScalar(10.0));
            const pEnd = end.clone().sub(dir.clone().multiplyScalar(subRadius * 0.85));
            const bridgeLen = pStart.distanceTo(pEnd);
            const midPoint = pStart.clone().add(pEnd).multiplyScalar(0.5);

            const bridgeWidth = 3.2;

            const deckMat = new THREE.MeshStandardMaterial({ color: 0x8D6E63, roughness: 0.8, flatShading: true });
            const deck = new THREE.Mesh(new THREE.BoxGeometry(bridgeWidth, 0.25, bridgeLen), deckMat);
            deck.position.copy(midPoint);
            deck.lookAt(pEnd);
            deck.castShadow = true;
            deck.receiveShadow = true;
            bridgeGroup.add(deck);

            const railMat = new THREE.MeshStandardMaterial({ color: 0x4E342E, roughness: 0.7 });
            const leftRail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.65, bridgeLen), railMat);
            leftRail.position.set(-bridgeWidth / 2 + 0.08, 0.32, 0);
            deck.add(leftRail);

            const rightRail = leftRail.clone();
            rightRail.position.x = bridgeWidth / 2 - 0.08;
            deck.add(rightRail);

            const lampMat = new THREE.MeshStandardMaterial({ color: 0xFFD54F });
            const numLamps = Math.max(2, Math.floor(bridgeLen / 5));
            for (let i = 1; i <= numLamps; i++) {
                const lampZ = -bridgeLen / 2 + (bridgeLen / (numLamps + 1)) * i;
                const lampL = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.7), railMat);
                lampL.position.set(-bridgeWidth / 2 + 0.1, 0.55, lampZ);
                const bulbL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), lampMat);
                bulbL.position.y = 0.4;
                lampL.add(bulbL);
                deck.add(lampL);

                const lampR = lampL.clone();
                lampR.position.x = bridgeWidth / 2 - 0.1;
                deck.add(lampR);
            }

            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x3E2723 });
            const numPillars = Math.floor(bridgeLen / 4);
            for(let i = 1; i <= numPillars; i++) {
                const pos = pStart.clone().add(dir.clone().multiplyScalar((bridgeLen / (numPillars + 1)) * i));
                const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 5), pillarMat);
                pillar.position.set(pos.x, pos.y - 2.5, pos.z);
                bridgeGroup.add(pillar);
            }

            scene.add(bridgeGroup);

            bridgesInfo.push({
                pStart: pStart,
                pEnd: pEnd,
                midPoint: midPoint,
                length: bridgeLen,
                width: bridgeWidth,
                subId: subId
            });
        }

        // --- Build Campus Islands Layout ---
        function buildCampusIslands() {
            bridgesInfo = [];
            characters = [];
            islands = [];

            const mainIslandData = campusData.find(d => d.isMain);
            createSingleIsland(mainIslandData, 0, 0, 0);

            const subIslandsData = campusData.filter(d => !d.isMain);
            const numSub = subIslandsData.length;
            const orbitRadius = 28;

            subIslandsData.forEach((data, index) => {
                const angle = Math.PI / 2 + (index / numSub) * Math.PI * 2;
                const x = Math.cos(angle) * orbitRadius;
                const z = Math.sin(angle) * orbitRadius;
                const y = Math.sin(index * 1.5) * 0.4;

                createSingleIsland(data, x, y, z);
                createConnectingBridge(0, 0, 0, x, y, z, data.radius, data.id);
            });

            campusData.forEach(d => {
                const isMain = d.isMain;
                const islandObj = isMain ? islands.find(i => i.userData.id === 'main') : islands.find(i => i.userData.id === d.id);
                const islandPos = islandObj ? islandObj.position.clone() : new THREE.Vector3(0,0,0);
                const count = isMain ? 6 : 3;
                for (let i = 0; i < count; i++) {
                    characters.push(new Character(islandPos, false));
                }
            });

            for (let i = 0; i < 14; i++) {
                if (bridgesInfo.length > 0) {
                    const randBridge = bridgesInfo[Math.floor(Math.random() * bridgesInfo.length)];
                    const startP = Math.random() > 0.5 ? randBridge.pStart.clone() : randBridge.pEnd.clone();
                    characters.push(new Character(startP, true));
                }
            }
        }

        // --- Interaction Handlers ---
        function onPointerDown(event) {
            if (event.target !== renderer.domElement) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            for (let i = 0; i < intersects.length; i++) {
                let obj = intersects[i].object;
                while (obj && !obj.userData.id && obj.parent) {
                    obj = obj.parent;
                }
                if (obj && obj.userData && obj.userData.id) {
                    openModal(obj.userData.id);
                    break;
                }
            }
        }

        function onPointerMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            let hoveredIslandId = null;
            for (let i = 0; i < intersects.length; i++) {
                let obj = intersects[i].object;
                while (obj && !obj.userData.id && obj.parent) {
                    obj = obj.parent;
                }
                if (obj && obj.userData && obj.userData.id) {
                    hoveredIslandId = obj.userData.id;
                    break;
                }
            }

            islands.forEach(island => {
                if (island.userData.id === hoveredIslandId) {
                    island.userData.targetScale = 1.08;
                } else {
                    island.userData.targetScale = 1.0;
                }
            });

            document.body.style.cursor = hoveredIslandId ? 'pointer' : 'default';
        }

                                </span>
                            `;
                            facilitiesContainer.appendChild(linkCard);
                        } else {
                            const itemCard = document.createElement('div');
                            itemCard.className = 'p-2.5 bg-white/80 rounded-xl border border-slate-200/80 shadow-sm flex items-center space-x-2 text-xs md:text-sm text-slate-800 font-medium hover:bg-blue-50 transition-colors';
                            itemCard.innerHTML = `
                                <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                                <span>${item}</span>
                            `;
                            facilitiesContainer.appendChild(itemCard);
                        }
                    });
                });
            }

            const modal = document.getElementById('info-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.children[0].classList.remove('scale-95');
            modal.children[0].classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('info-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.children[0].classList.remove('scale-100');
            modal.children[0].classList.add('scale-95');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Main Scene Initialization ---
        function init() {
            const dateEl = document.getElementById('current-date');
            const now = new Date();
            const daysOfWeek = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dayName = daysOfWeek[now.getDay()];
            dateEl.innerText = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} (${dayName})`;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 35, 55);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.05;
            controls.minDistance = 15;
            controls.maxDistance = 110;
            controls.target.set(0, 0, 0);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            labelsContainer = document.getElementById('labels-container');

            setupLighting();
            createOcean();
            createClouds();
            buildCampusIslands();

            setLightingMode('realtime');

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);

            document.getElementById('close-modal').addEventListener('click', closeModal);
            document.getElementById('modal-ok-btn').addEventListener('click', closeModal);

            animate();
        }

        // --- Render Loop ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            controls.update();

            if (waterMesh) {
                const pos = waterMesh.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const u = pos.getX(i);
                    const v = pos.getY(i);
                    const z = Math.sin(elapsedTime * 1.5 + u * 0.2) * 0.25 + Math.cos(elapsedTime * 1.2 + v * 0.2) * 0.25;
                    pos.setZ(i, z);
                }
                waterMesh.geometry.computeVertexNormals();
                waterMesh.geometry.attributes.position.needsUpdate = true;
            }

            if (cloudsGroup) {
                cloudsGroup.rotation.y = elapsedTime * 0.02;
            }

            islands.forEach(group => {
                const off = group.userData.floatOffset;
                group.position.y = group.userData.baseY + Math.sin(elapsedTime * 1.2 + off) * 0.25;

                group.userData.currentScale += (group.userData.targetScale - group.userData.currentScale) * 0.1;
                group.scale.setScalar(group.userData.currentScale);

                if (group.userData.labelEl) {
                    const worldPos = group.position.clone();
                    worldPos.y += group.userData.radius * 0.35 + 3.8;

                    const camSpacePos = worldPos.clone().applyMatrix4(camera.matrixWorldInverse);
                    const labelEl = group.userData.labelEl;

                    if (camSpacePos.z < 0) {
                        const ndc = worldPos.clone().project(camera);

                        if (ndc.x >= -1.1 && ndc.x <= 1.1 && ndc.y >= -1.1 && ndc.y <= 1.1) {
                            const x = (ndc.x * 0.5 + 0.5) * window.innerWidth;
                            const y = (-(ndc.y * 0.5) + 0.5) * window.innerHeight;

                            labelEl.style.display = 'flex';
                            labelEl.style.left = `${x}px`;
                            labelEl.style.top = `${y}px`;
                            labelEl.style.opacity = '1';
                        } else {
                            labelEl.style.display = 'none';
                        }
                    } else {
                        labelEl.style.display = 'none';
                    }
                }
            });

            characters.forEach(char => char.update(elapsedTime));

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
