        // --- Mode Switcher Logic ---
        function setLightingMode(mode) {
            currentMode = mode;

            // Update active button styles mutually exclusively
            const modes = ['realtime', 'day', 'dusk', 'night'];
            modes.forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                if (!btn) return;
                if (m === mode) {
                    btn.className = "mode-btn px-2.5 py-1.5 rounded-xl text-xs font-black transition-all flex items-center gap-1 bg-blue-600 text-white shadow-md scale-105";
                } else {
                    btn.className = "mode-btn px-2.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1 text-slate-700 hover:bg-white/60 hover:scale-105";
                }
            });

            let effectivePresetKey = mode;
            if (mode === 'realtime') {
                const hour = new Date().getHours();
                if (hour >= 6 && hour < 17) {
                    effectivePresetKey = 'day';
                } else if (hour >= 17 && hour < 19) {
                    effectivePresetKey = 'dusk';
                } else {
                    effectivePresetKey = 'night';
                }
            }

            applyLightingPreset(effectivePresetKey, mode === 'realtime');
        }

        function applyLightingPreset(key, isRealtime = false) {
            const preset = lightingPresets[key];
            if (!preset) return;

            if (scene) {
                scene.background.setHex(preset.bg);
                if (scene.fog) scene.fog.color.setHex(preset.fog);
            }

            if (ambientLight) {
                ambientLight.color.setHex(preset.ambientColor);
                ambientLight.intensity = preset.ambientIntensity;
            }

            if (sunLight) {
                sunLight.color.setHex(preset.sunColor);
                sunLight.intensity = preset.sunIntensity;
                sunLight.position.set(...preset.sunPos);
            }

            if (hemiLight) {
                hemiLight.color.setHex(preset.hemiSky);
                hemiLight.groundColor.setHex(preset.hemiGround);
                hemiLight.intensity = preset.hemiIntensity;
            }

            getGlassMat().emissiveIntensity = key === 'night' ? 0.9 : (key === 'dusk' ? 0.35 : 0);
            if (waterMesh && waterMesh.material) {
                waterMesh.material.color.setHex(preset.waterColor);
            }

            // Update UI elements
            const statusTextEl = document.getElementById('weather-status-text');
            const tempTextEl = document.getElementById('weather-temp-text');
            const iconBgEl = document.getElementById('weather-icon-bg');
            const iconSvgEl = document.getElementById('weather-icon-svg');

            if (statusTextEl) {
                statusTextEl.innerText = isRealtime ? `${preset.weatherText} (即時)` : preset.weatherText;
            }
            if (tempTextEl) tempTextEl.innerText = preset.tempText;
            if (iconBgEl) iconBgEl.className = `p-2 rounded-xl flex items-center justify-center ${preset.badgeBg}`;
            if (iconSvgEl) iconSvgEl.innerHTML = preset.iconSvg;
        }

        // --- Walking Character Class (只沿道路 / 橋梁 / 島嶼步道行走) ---
        class Character {
            constructor(node) {
                this.group = new THREE.Group();
                const hue = Math.random();
                const shirt = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(hue, 0.65, 0.58), roughness: 0.55 });
                const pants = new THREE.MeshStandardMaterial({ color: [0x37474F, 0x3F51B5, 0x5D4037, 0x00695C][Math.floor(Math.random() * 4)], roughness: 0.7 });
                const skin = new THREE.MeshStandardMaterial({ color: [0xFFDCC8, 0xF5C6A5, 0xE0AC86, 0xC68E6B][Math.floor(Math.random() * 4)], roughness: 0.5 });
                const hairMat = new THREE.MeshStandardMaterial({ color: [0x2B1B12, 0x3E2723, 0x111111, 0x6D4C41][Math.floor(Math.random() * 4)], roughness: 0.6 });
                const shoeMat = new THREE.MeshStandardMaterial({ color: 0xFAFAFA, roughness: 0.5 });
                const S = (geo, mat) => { const m = new THREE.Mesh(geo, mat); m.castShadow = true; return m; };

                this.body = S(new THREE.CylinderGeometry(0.17, 0.2, 0.5, 14), shirt);
                this.body.position.y = 0.67;
                this.group.add(this.body);

                this.head = new THREE.Group();
                this.head.position.y = 1.08;
                this.head.add(S(new THREE.SphereGeometry(0.2, 18, 14), skin));
                const hair = S(new THREE.SphereGeometry(0.215, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hairMat);
                hair.rotation.x = -0.25; hair.position.y = 0.02;
                this.head.add(hair);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
                [-0.07, 0.07].forEach(ex => {
                    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.024, 8, 8), eyeMat);
                    eye.position.set(ex, 0.0, 0.18);
                    this.head.add(eye);
                });
                this.group.add(this.head);

                const makeLimb = (len, rad, mat, px, py, endMat, endRad) => {
                    const pivot = new THREE.Group();
                    pivot.position.set(px, py, 0);
                    const seg = S(new THREE.CylinderGeometry(rad, rad * 0.9, len, 10), mat);
                    seg.position.y = -len / 2;
                    pivot.add(seg);
                    const end = S(new THREE.SphereGeometry(endRad, 10, 8), endMat);
                    end.position.y = -len;
                    if (endMat === shoeMat) { end.scale.set(1, 0.7, 1.5); end.position.z = 0.04; }
                    pivot.add(end);
                    this.group.add(pivot);
                    return pivot;
                };
                this.leftLeg = makeLimb(0.4, 0.07, pants, -0.09, 0.42, shoeMat, 0.085);
                this.rightLeg = makeLimb(0.4, 0.07, pants, 0.09, 0.42, shoeMat, 0.085);
                this.leftArm = makeLimb(0.34, 0.05, shirt, -0.25, 0.86, skin, 0.055);
                this.rightArm = makeLimb(0.34, 0.05, shirt, 0.25, 0.86, skin, 0.055);

                if (Math.random() < 0.55) {
                    const bag = S(new THREE.BoxGeometry(0.26, 0.3, 0.12), new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL((hue + 0.5) % 1, 0.7, 0.5), roughness: 0.6 }));
                    bag.position.set(0, 0.7, -0.2);
                    this.group.add(bag);
                }

                this.group.scale.setScalar(1.12);
                this.speed = 1.2 + Math.random() * 1.0;   // 單位/秒
                this.walkCycle = Math.random() * 10;
                this.latBase = (Math.random() - 0.5) * 2; // 道路寬度內的左右位置 (-1~1)
                this.lat = 0;
                this.prev = null;
                this.from = node;
                this.isIdle = false; this.idleTimer = 0;
                this.yaw = 0;
                this.pickNext();
                this.group.position.copy(this.posAt(0));
                scene.add(this.group);
            }

            yOf(n) { return n.isl ? n.isl.position.y + 0.78 : n.p.y; }

            pickNext() {
                const nb = this.from.nb;
                const ok = e => !this.allowed || this.allowed.has(e.to);
                let c = nb.filter(e => e.to !== this.prev && ok(e));
                if (!c.length) c = nb.filter(ok);
                if (!c.length) c = nb;
                const e = c[Math.floor(Math.random() * c.length)];
                this.to = e.to; this.halfW = e.halfW; this.t = 0;
                const dx = this.to.p.x - this.from.p.x, dz = this.to.p.z - this.from.p.z;
                this.len = Math.max(0.01, Math.hypot(dx, dz));
                this.dirX = dx / this.len; this.dirZ = dz / this.len;
            }

            posAt(t) {
                const a = this.from.p, b = this.to.p;
                const target = this.latBase * this.halfW * 0.8;
                this.lat += (target - this.lat) * 0.08;
                const x = a.x + (b.x - a.x) * t - this.dirZ * this.lat;
                const z = a.z + (b.z - a.z) * t + this.dirX * this.lat;
                const y = this.yOf(this.from) + (this.yOf(this.to) - this.yOf(this.from)) * t;
                return new THREE.Vector3(x, y, z);
            }

            update(dt) {
                if (this.isIdle) {
                    this.idleTimer -= dt;
                    [this.leftLeg, this.rightLeg, this.leftArm, this.rightArm].forEach(p => p.rotation.x *= 0.85);
                    this.body.position.y = 0.67;
                    this.head.rotation.y = Math.sin(this.walkCycle * 0.3 + this.idleTimer) * 0.4;
                    if (this.idleTimer <= 0) { this.isIdle = false; this.head.rotation.y = 0; this.pickNext(); }
                    const p = this.posAt(0); this.group.position.copy(p);
                    return;
                }
                this.t += this.speed * dt / this.len;
                if (this.t >= 1) {
                    this.prev = this.from; this.from = this.to; this.t = 0;
                    const deadEnd = this.allowed ? this.from.nb.filter(e => this.allowed.has(e.to)).length <= 1 : this.from.nb.length === 1;
                    if (deadEnd || Math.random() < 0.04) {
                        this.isIdle = true; this.idleTimer = 1.2 + Math.random() * 2.2;
                        if (deadEnd) this.prev = null;
                        this.to = this.from; this.len = 1;
                        return;
                    }
                    this.pickNext();
                }
                this.group.position.copy(this.posAt(this.t));
                let diff = Math.atan2(this.dirX, this.dirZ) - this.yaw;
                diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                this.yaw += diff * 0.15;
                this.group.rotation.y = this.yaw;

                this.walkCycle += dt * this.speed * 5;
                const sw = Math.sin(this.walkCycle) * 0.6;
                this.leftLeg.rotation.x = sw; this.rightLeg.rotation.x = -sw;
                this.leftArm.rotation.x = -sw * 0.8; this.rightArm.rotation.x = sw * 0.8;
                this.body.position.y = 0.67 + Math.abs(Math.sin(this.walkCycle)) * 0.03;
                this.head.position.y = 1.08 + Math.abs(Math.sin(this.walkCycle)) * 0.03;
            }
        }

        // --- Texture helpers ---
        function makeTex(canvas) {
            const t = new THREE.CanvasTexture(canvas);
            t.anisotropy = 8;
            return t;
        }
        function createGrassTexture(hex) {
            const c = document.createElement('canvas'); c.width = c.height = 256;
            const ctx = c.getContext('2d');
            const base = new THREE.Color(hex);
            ctx.fillStyle = '#' + base.getHexString(); ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 900; i++) {
                const l = base.clone().offsetHSL(0, 0, (Math.random() - 0.5) * 0.12);
                ctx.fillStyle = '#' + l.getHexString();
                ctx.globalAlpha = 0.5;
                ctx.beginPath(); ctx.arc(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 0, 7); ctx.fill();
            }
            ctx.globalAlpha = 1;
            const t = makeTex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 1);
            return t;
        }

        // --- Texture Generation Functions ---
        function createTennisCourtTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.scale(2, 2);
            
            ctx.fillStyle = '#2A6888';
            ctx.fillRect(0, 0, 512, 256);
            ctx.fillStyle = '#3B8256';
            ctx.fillRect(32, 32, 448, 192);
            
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 4;
            ctx.strokeRect(32, 32, 448, 192);
            ctx.strokeRect(64, 32, 384, 192);
            
            ctx.beginPath();
            ctx.moveTo(256, 32); ctx.lineTo(256, 224);
            ctx.moveTo(128, 64); ctx.lineTo(128, 192);
            ctx.moveTo(384, 64); ctx.lineTo(384, 192);
            ctx.moveTo(128, 128); ctx.lineTo(384, 128);
            ctx.stroke();
            
            return makeTex(canvas);
        }

        function createPlaygroundTexture() {
            const c = document.createElement('canvas');

            ctx.fillStyle = '#C1432A'; ctx.beginPath(); ctx.roundRect(6, 6, 500, 314, [100]); ctx.fill();
            ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();
            ctx.lineWidth = 1.1; ctx.strokeStyle = 'rgba(255,255,255,0.75)';
            for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.roundRect(6 + k * 9.5, 6 + k * 9.5, 500 - 19 * k, 314 - 19 * k, [100 - 9.5 * k]); ctx.stroke(); }
            ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(400, 282); ctx.lineTo(400, 320); ctx.stroke();
            ctx.fillStyle = '#6DBB6F'; ctx.beginPath(); ctx.roundRect(44, 44, 424, 238, [62]); ctx.fill();

            half(67, 106, true); half(219, 259, false);

            // ===== 足球場地 (操場右半部) =====

            ctx.lineWidth = 1.5; ctx.strokeStyle = '#FFFFFF';

        // --- Shared glass (夜間會發光) ---
        let sharedGlassMat = null;
        function getGlassMat() {
            if (!sharedGlassMat) sharedGlassMat = new THREE.MeshStandardMaterial({ color: 0x78A9C4, roughness: 0.08, metalness: 0.4, emissive: 0xFFE082, emissiveIntensity: 0 });

        // --- Door Mesh Generator ---
        function createDoorMesh(width = 1.6, height = 1.5) {
            const g = new THREE.Group();
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x37474F, roughness: 0.45 });
            const frame = new THREE.Mesh(new THREE.BoxGeometry(width + 0.2, height + 0.1, 0.15), frameMat);
            frame.position.y = height / 2; frame.castShadow = true; g.add(frame);

            const glass = getGlassMat();
            [-1, 1].forEach(s => {
                const d = new THREE.Mesh(new THREE.BoxGeometry(width / 2 - 0.06, height - 0.1, 0.08), glass);
                d.position.set(s * width / 4, height / 2, 0.03); g.add(d);
                const h = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.35, 8), new THREE.MeshStandardMaterial({ color: 0xFFD54F, metalness: 0.8, roughness: 0.3 }));
                h.position.set(s * 0.07, height / 2, 0.1); g.add(h);
            });

            // 圓弧形雨遮
            const awning = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, width + 0.6, 20, 1, false, 0, Math.PI),
                new THREE.MeshStandardMaterial({ color: 0x1976D2, roughness: 0.4 }));
            awning.rotation.z = Math.PI / 2; awning.rotation.y = Math.PI / 2;
            awning.scale.set(1, 1, 0.9);
            awning.position.set(0, height + 0.12, 0.28); awning.castShadow = true;
            const awn2 = new THREE.Mesh(new THREE.BoxGeometry(width + 0.6, 0.12, 0.8), new THREE.MeshStandardMaterial({ color: 0x1565C0, roughness: 0.4 }));
            awn2.position.set(0, height + 0.1, 0.3); awn2.castShadow = true; g.add(awn2);
            return g;
        }

        let railMats = null;
        function getRailMats() {
            if (!railMats) railMats = {
                green: new THREE.MeshStandardMaterial({ color: 0x2E9E4F, roughness: 0.45, metalness: 0.25 }),
                glass: new THREE.MeshStandardMaterial({ color: 0xBFE6F2, transparent: true, opacity: 0.32, roughness: 0.05, metalness: 0.1, side: THREE.DoubleSide, depthWrite: false })
            };
            return railMats;
        }
        function addRailing(g, x0, z0, x1, z1, y) {
            const len = Math.hypot(x1 - x0, z1 - z0);
            if (len < 0.05) return;
            const { green, glass } = getRailMats();
            const grp = new THREE.Group();
            grp.position.set((x0 + x1) / 2, y, (z0 + z1) / 2);
            grp.rotation.y = Math.atan2(x1 - x0, z1 - z0);
            const add = (geo, m, py, pz, shadow = true) => { const o = new THREE.Mesh(geo, m); o.position.set(0, py, pz); o.castShadow = shadow; grp.add(o); return o; };
            add(new THREE.BoxGeometry(0.05, 0.55, len), glass, 0.3, 0, false);          // 透明強化玻璃矮牆
            add(new THREE.BoxGeometry(0.07, 0.05, len), green, 0.58, 0);                 // 玻璃壓條
            add(new THREE.BoxGeometry(0.07, 0.07, len), green, 1.02, 0);                 // 綠色扶手
            add(new THREE.BoxGeometry(0.04, 0.04, len), green, 0.82, 0);                 // 綠色中間橫桿
            const n = Math.max(1, Math.round(len / 1.1));
            for (let i = 0; i <= n; i++) add(new THREE.CylinderGeometry(0.035, 0.035, 1.0, 8), green, 0.5, -len / 2 + len * i / n);
            g.add(grp);
        }

        // --- 文字招牌 ---
        function createTextSign(text, w, h, bg, fg) {
            const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512 * h / w);
            const ctx = c.getContext('2d');
            const draw = () => {
                ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height);
                ctx.strokeStyle = fg; ctx.lineWidth = 8; ctx.strokeRect(10, 10, c.width - 20, c.height - 20);
                ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = `900 ${Math.round(c.height * 0.52)}px 'Noto Sans TC','Microsoft JhengHei',sans-serif`;
                ctx.fillText(text, c.width / 2, c.height / 2 + 4);
            };
            draw();
            const tex = makeTex(c);
            if (document.fonts && document.fonts.load) document.fonts.load("900 40px 'Noto Sans TC'", text).then(() => { draw(); tex.needsUpdate = true; }).catch(() => {});
            const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, side: THREE.DoubleSide }));
            m.castShadow = true;
            return m;
        }

        // --- 建築物 1~2 樓教室外走廊 (有屋頂)；2 樓設綠色欄杆 + 強化玻璃矮牆 ---
        // c = { side: ±1 (走廊在建築物局部 ±z 側), w: 走廊寬, a, b: 沿局部 x 的範圍, railA, railB: 外緣欄杆範圍, endA, endB: 兩端是否加欄杆 }
        function addBuildingCorridor(group, floors, width, depth, c) {
            const fh = 1.8, s = c.side || -1, w = c.w || 1.6, a = c.a, b = c.b, cf = Math.min(floors, 2);
            const len = b - a, xm = (a + b) / 2, zIn = s * depth / 2, zOut = s * (depth / 2 + w), zc = (zIn + zOut) / 2;
            const M = (col, r) => new THREE.MeshStandardMaterial({ color: col, roughness: r });
            const slabM = M(0xD7CCC8, 0.8), roofM = M(0x1565C0, 0.5), pilM = M(0xECEFF1, 0.5), doorM = M(0x5D4037, 0.7);
            const S = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; group.add(o); return o; };
            S(new THREE.BoxGeometry(len, 0.3, w - 0.15), slabM, xm, 0.15, s * (depth / 2 + (w + 0.15) / 2));     // 1 樓地坪
            for (let f = 1; f < cf; f++) S(new THREE.BoxGeometry(len, 0.16, w), slabM, xm, f * fh - 0.08, zc);   // 2 樓走廊樓板
            S(new THREE.BoxGeometry(len + 0.2, 0.14, w + 0.3), roofM, xm, cf * fh + 0.07, zc + s * 0.1);        // 走廊屋頂
            const n = Math.max(1, Math.round(len / 2.0)), ph = cf * fh - 0.3;
            for (let i = 0; i <= n; i++) S(new THREE.CylinderGeometry(0.07, 0.08, ph, 8), pilM, a + len * i / n, 0.3 + ph / 2, zOut - s * 0.1);
            if (cf >= 2) {
                const zr = zOut - s * 0.05;
                addRailing(group, c.railA !== undefined ? c.railA : a, zr, c.railB !== undefined ? c.railB : b, zr, fh);
                if (c.endA !== false) addRailing(group, a, zIn, a, zr, fh);
                if (c.endB !== false) addRailing(group, b, zIn, b, zr, fh);
            }
            // 教室門 (落在兩扇窗之間)
            const nw = Math.max(2, Math.floor(width / 1.5)), sp = width / (nw + 1);
            for (let i = 1; i < nw; i++) {
                const dx = -width / 2 + sp * (i + 0.5);
                if (dx < a + 0.5 || dx > b - 0.5) continue;
                for (let f = 0; f < cf; f++) {
                    if (s > 0 && f === 0 && Math.abs(dx) < 1.3) continue;   // 避開正門
                    const d = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.07), doorM);
                    d.position.set(dx, (f === 0 ? 0.3 : f * fh) + 0.7, s * (depth / 2 + 0.04)); d.castShadow = true; group.add(d);
                }
            }
        }

        // --- 烏魚子廣場 (連鎖磚地板，造型取自烏魚子) ---
        const ROE_SEGS = [
            [0.28, -0.5, 0.5, -0.3, 0.5, -0.05], [0.5, 0.15, 0.5, 0.32, 0.42, 0.4], [0.42, 0.47, 0.3, 0.53, 0.2, 0.5], [0.12, 0.48, 0.05, 0.42, 0, 0.42],
            [-0.05, 0.42, -0.12, 0.48, -0.2, 0.5], [-0.3, 0.53, -0.42, 0.47, -0.42, 0.4], [-0.5, 0.32, -0.5, 0.15, -0.5, -0.05], [-0.5, -0.3, -0.28, -0.5, 0, -0.5]
        ];
        function roeOutline(p, tx, ty) {
            p.moveTo(tx(0), ty(-0.5));
            ROE_SEGS.forEach(s => p.bezierCurveTo(tx(s[0]), ty(s[1]), tx(s[2]), ty(s[3]), tx(s[4]), ty(s[5])));
        }
        function createRoePlazaTexture() {
            const cw = 512, ch = 1024;
            const c = document.createElement('canvas'); c.width = cw; c.height = ch;
            const ctx = c.getContext('2d');
            const tx = u => (u + 0.5) * cw, ty = v => (0.5 - v) * ch;
            let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
            ctx.save(); ctx.beginPath(); roeOutline(ctx, tx, ty); ctx.closePath(); ctx.clip();
            ctx.fillStyle = '#7A5427'; ctx.fillRect(0, 0, cw, ch);
            const tones = ['#DB9C48', '#D18D3A', '#E3AC5C', '#C98032', '#D8963F'], bw = 48, bh = 24;
            for (let row = 0; row * bh < ch; row++) for (let col = -1; col * bw < cw; col++) {   // 連鎖磚 (錯縫排列)
                ctx.fillStyle = tones[Math.floor(rnd() * tones.length)];
                ctx.fillRect(col * bw + (row % 2 ? bw / 2 : 0) + 1.5, row * bh + 1.5, bw - 3, bh - 3);
            }
            ctx.strokeStyle = 'rgba(105,55,18,0.6)'; ctx.lineWidth = 11; ctx.lineCap = 'round';   // 中央凹槽 (烏魚子雙葉)
            ctx.beginPath(); ctx.moveTo(tx(0), ty(0.42)); ctx.bezierCurveTo(tx(-0.03), ty(0.25), tx(0.03), ty(0.0), tx(0), ty(-0.38)); ctx.stroke();
            ctx.beginPath(); roeOutline(ctx, tx, ty); ctx.closePath();                                // 外緣淺色鋪邊
            ctx.lineWidth = 46; ctx.strokeStyle = '#F0DDB0'; ctx.lineJoin = 'round'; ctx.stroke();
            ctx.restore();
            ctx.beginPath(); roeOutline(ctx, tx, ty); ctx.closePath(); ctx.lineWidth = 5; ctx.strokeStyle = '#8A5A22'; ctx.stroke();
            return makeTex(c);
        }
        function addRoePlaza(g, cx, cz, rotY, W, L) {
            const shape = new THREE.Shape();
            roeOutline(shape, u => u * W, v => v * L); shape.closePath();
            const geo = new THREE.ShapeGeometry(shape, 24);
            const pos = geo.attributes.position, uv = geo.attributes.uv;
            for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / W + 0.5, pos.getY(i) / L + 0.5);
            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: createRoePlazaTexture(), roughness: 0.85 }));
            mesh.rotation.x = -Math.PI / 2; mesh.receiveShadow = true;
            const grp = new THREE.Group(); grp.position.set(cx, 0.8, cz); grp.rotation.y = rotY; grp.add(mesh);
            g.add(grp);
        }

        // --- Multi-Story Building Generator ---
        function createMultiStoryBuilding(floors, width, depth, wallColor = 0xF5F5F5, roofColor = 0xD32F2F, hasDoor = true, solarRoof = false, corridor = null) {
            const group = new THREE.Group();
            const fh = 1.8;
            const wallMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.55 });
            const bandMat = new THREE.MeshStandardMaterial({ color: 0xE3DAC9, roughness: 0.6 });
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.5 });
            const roofMat = new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.5 });
            const glass = getGlassMat();
            const add = (m, x, y, z, shadow = true) => { m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; group.add(m); return m; };

            add(new THREE.Mesh(new THREE.BoxGeometry(width + 0.3, 0.3, depth + 0.3), bandMat), 0, 0.15, 0); // 基座
            for (let f = 0; f < floors; f++) {
                const y = f * fh + fh / 2;
                add(new THREE.Mesh(new THREE.BoxGeometry(width, fh, depth), wallMat), 0, y, 0);
                if (f > 0) add(new THREE.Mesh(new THREE.BoxGeometry(width + 0.25, 0.14, depth + 0.25), bandMat), 0, f * fh, 0);

                const n = Math.max(2, Math.floor(width / 1.5)), sp = width / (n + 1);
                for (let i = 1; i <= n; i++) {
                    const wx = -width / 2 + sp * i;
                    if (f === 0 && hasDoor && Math.abs(wx) < 1.3) continue;
                    [1, -1].forEach(side => {
                        const w = new THREE.Group();
                        w.add(new THREE.Mesh(new THREE.BoxGeometry(0.98, 0.98, 0.06), frameMat));
                        const gl = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.82, 0.09), glass); w.add(gl);
                        const sill = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.07, 0.18), frameMat); sill.position.y = -0.52; w.add(sill);
                        w.position.set(wx, y + 0.1, side * (depth / 2 + 0.02));
                        if (side < 0) w.rotation.y = Math.PI;
                        group.add(w);
                    });
                }
            }
            const H = floors * fh;
            add(new THREE.Mesh(new THREE.BoxGeometry(width + 0.6, 0.28, depth + 0.6), roofMat), 0, H + 0.14, 0);
            add(new THREE.Mesh(new THREE.BoxGeometry(width + 0.2, 0.3, depth + 0.2), bandMat), 0, H + 0.42, 0).scale.set(1, 0.6, 1);
            if (solarRoof) addSolarShedRoof(group, width, depth, H + 0.3);
            if (hasDoor) {
                const door = createDoorMesh(1.6, 1.4);
                door.position.set(0, 0.3, depth / 2 + 0.01);
                group.add(door);
                const step = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.2, 0.7), bandMat);
                step.position.set(0, 0.1, depth / 2 + 0.45); step.receiveShadow = true; group.add(step);
            }
            if (corridor) addBuildingCorridor(group, floors, width, depth, corridor);
            return group;
        }

            pectoralFinGroupR.position.set(0.32, 0.52, 0.12);

            group.add(body);
            const [pm, pf] = getPanelMats();
            const ang = Math.atan2(rise - low, D), slopeLen = Math.hypot(D, rise - low);
            const pg = new THREE.Group();

        function createCourtsTexture(withVolley) {
            const S = 140, W = 7.2, H = 7.7;
            const c = document.createElement('canvas'); c.width = Math.round(W * S); c.height = Math.round(H * S);
            const ctx = c.getContext('2d'); ctx.scale(S, S);
            ctx.fillStyle = '#2A6888'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = '#FFFFFF'; ctx.lineCap = 'butt';
            const tennis = cy => {
                const L = 6.4, Wd = 3.0, x0 = (W - L) / 2, y0 = cy - Wd / 2, mx = W / 2;
                ctx.fillStyle = '#3B8256'; ctx.fillRect(x0 - 0.3, y0 - 0.3, L + 0.6, Wd + 0.6);
                ctx.lineWidth = 0.05; ctx.strokeRect(x0, y0, L, Wd);
                const sy = 0.125 * Wd, sv = 0.269 * L;
                ctx.beginPath();
                ctx.moveTo(x0, y0 + sy); ctx.lineTo(x0 + L, y0 + sy);
                ctx.moveTo(x0, y0 + Wd - sy); ctx.lineTo(x0 + L, y0 + Wd - sy);
                ctx.moveTo(mx - sv, y0 + sy); ctx.lineTo(mx - sv, y0 + Wd - sy);
                ctx.moveTo(mx + sv, y0 + sy); ctx.lineTo(mx + sv, y0 + Wd - sy);
                ctx.moveTo(mx - sv, cy); ctx.lineTo(mx + sv, cy);
                ctx.stroke();
                ctx.lineWidth = 0.03; ctx.beginPath(); ctx.moveTo(mx, y0 - 0.12); ctx.lineTo(mx, y0 + Wd + 0.12); ctx.stroke();
            };
            const volley = cy => {
                const L = 6.0, Wd = 3.0, x0 = (W - L) / 2, y0 = cy - Wd / 2, mx = W / 2;
                ctx.fillStyle = '#B8553A'; ctx.fillRect(x0 - 0.3, y0 - 0.3, L + 0.6, Wd + 0.6);
                ctx.fillStyle = '#E3A15E'; ctx.fillRect(x0, y0, L, Wd);
                ctx.lineWidth = 0.05; ctx.strokeRect(x0, y0, L, Wd);
                ctx.beginPath();
                ctx.moveTo(mx, y0); ctx.lineTo(mx, y0 + Wd);
                ctx.moveTo(mx - L / 6, y0); ctx.lineTo(mx - L / 6, y0 + Wd);
                ctx.moveTo(mx + L / 6, y0); ctx.lineTo(mx + L / 6, y0 + Wd);
                ctx.stroke();

        // --- 光輝館：挑高牆面 + 斜屋頂 ---
        function createHallBuilding(W, D) {
            const group = new THREE.Group();
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xF5F5F5, roughness: 0.55 });
            const bandMat = new THREE.MeshStandardMaterial({ color: 0xE3DAC9, roughness: 0.6 });
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.5 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xA5402D, roughness: 0.55 });
            const glass = getGlassMat();
            const add = (m, x, y, z) => { m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; group.add(m); return m; };
            const wallH = 3.6, rise = 2.3;
            add(new THREE.Mesh(new THREE.BoxGeometry(W + 0.3, 0.3, D + 0.3), bandMat), 0, 0.15, 0);
            add(new THREE.Mesh(new THREE.BoxGeometry(W, wallH, D), wallMat), 0, wallH / 2, 0);
            add(new THREE.Mesh(new THREE.BoxGeometry(W + 0.2, 0.14, D + 0.2), bandMat), 0, 1.0, 0);
            const n = Math.max(3, Math.floor(W / 1.7)), sp = W / (n + 1);
            for (let i = 1; i <= n; i++) {
                const wx = -W / 2 + sp * i;
                [1, -1].forEach(side => {
                    if (side > 0 && Math.abs(wx) < 1.5) return;
                    const w = new THREE.Group();
                    w.add(new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.8, 0.06), frameMat));
                    w.add(new THREE.Mesh(new THREE.BoxGeometry(0.84, 1.64, 0.09), glass));
                    w.position.set(wx, 2.35, side * (D / 2 + 0.02));
                    if (side < 0) w.rotation.y = Math.PI;
                    group.add(w);
                });
            }
            add(new THREE.Mesh(new THREE.BoxGeometry(W + 0.9, 0.16, D + 0.9), roofMat), 0, wallH + 0.08, 0);
            const RD = D + 0.9, RW = W + 0.9;
            const shape = new THREE.Shape();
            shape.moveTo(-RD / 2, 0); shape.lineTo(RD / 2, 0); shape.lineTo(0, rise); shape.closePath();
            const geo = new THREE.ExtrudeGeometry(shape, { depth: RW, bevelEnabled: false });
            geo.translate(0, 0, -RW / 2);
            const roof = new THREE.Mesh(geo, roofMat);
            roof.rotation.y = -Math.PI / 2; roof.position.set(0, wallH + 0.16, 0);
            roof.castShadow = true; roof.receiveShadow = true; group.add(roof);
            add(new THREE.Mesh(new THREE.BoxGeometry(RW + 0.1, 0.12, 0.3), bandMat), 0, wallH + 0.16 + rise, 0);   // 屋脊
            const door = createDoorMesh(2.2, 1.8);
            door.position.set(0, 0.3, D / 2 + 0.01); group.add(door);
            const step = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.2, 0.8), bandMat);
            step.position.set(0, 0.1, D / 2 + 0.5); step.receiveShadow = true; group.add(step);
            return group;
        }

        // --- 賜福樓：連鎖磚泡泡廣場 ---
        function createBubblePlazaTexture(Wu, Hu) {
            const S = 80; Wu = Wu || 10; Hu = Hu || 12;
            const c = document.createElement('canvas'); c.width = Math.round(Wu * S); c.height = Math.round(Hu * S);
            const ctx = c.getContext('2d');
            let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
            const tones = ['#D9B38C', '#CFA27A', '#E2C09B', '#C4926B', '#D6AA83'];
            ctx.fillStyle = '#A8896B'; ctx.fillRect(0, 0, c.width, c.height);
            const bw = 40, bh = 20;                                             // 連鎖磚 (錯縫排列)
            for (let row = 0; row * bh < c.height; row++) {
                for (let col = -1; col * bw < c.width; col++) {
                    const x = col * bw + (row % 2 ? bw / 2 : 0), y = row * bh;
                    ctx.fillStyle = tones[Math.floor(rnd() * tones.length)];
                    ctx.fillRect(x + 1, y + 1, bw - 2, bh - 2);
                }
            }
            const cols = ['rgba(66,165,245,', 'rgba(38,198,218,', 'rgba(244,143,177,', 'rgba(255,213,79,', 'rgba(129,199,132,', 'rgba(186,104,200,'];
            const nb = Math.round(46 * (Wu * Hu) / 120);
            for (let i = 0; i < nb; i++) {                                      // 泡泡圖案
                const r = (0.25 + rnd() * 0.9) * S, x = rnd() * c.width, y = rnd() * c.height, col = cols[i % cols.length];
                ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = col + '0.55)'; ctx.fill();
                ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke();
                ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.22, 0, 7); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fill();
            }
            return makeTex(c);
        }
        function addBubblePlaza(g, cx, cz, w, h) {
            const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: createBubblePlazaTexture(w, h), roughness: 0.85 }));
            m.rotation.x = -Math.PI / 2; m.position.set(cx, 0.77, cz); m.receiveShadow = true; g.add(m);
        }

        // =============== 賜福樓：依「賜福樓.jpg」配置 ===============
        // 左棟(西)：6 間教室 + 中間 1-3 樓樓梯，東側為 1-3 樓教室外走廊(有屋頂)
        // 右棟(東)：縱向棟 3 間教室(西側走廊有屋頂、北端旋轉樓梯、南端 1-3 樓樓梯) + 下方橫向棟 1 間大教室(北側走廊)
        // 兩棟之間：1-3 樓連通走道 (3 樓沒屋頂)；中間為泡泡廣場
        function createMainComplex() {
            const g = new THREE.Group();

            const win = (x, y, z, ry) => { const w = new THREE.Group(); w.add(new THREE.Mesh(B(1.0, 0.9, 0.06), frameM)); w.add(new THREE.Mesh(B(0.84, 0.74, 0.09), glass)); w.position.set(x, y, z); w.rotation.y = ry; g.add(w); };
            const door = (x, y, z, ry) => { const d = new THREE.Mesh(B(0.8, 1.2, 0.07), doorM); d.position.set(x, y, z); d.rotation.y = ry; d.castShadow = true; g.add(d); };
            const rail = (x0, z0, x1, z1, f) => addRailing(g, x0, z0, x1, z1, lv(f));
            const split = (a, b, n) => Array.from({ length: n }, (_, i) => [a + (b - a) * i / n, a + (b - a) * (i + 1) / n]);

            // ---- 教室棟量體 (三層) ----
            const block = (x0, x1, z0, z1) => {
                const w = x1 - x0, d = z1 - z0, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
                S(B(w, PL, d), plinthM, cx, PL / 2, cz);
                [0, 1].forEach(f => S(B(w, FH - 0.18, d), wall, cx, lv(f) + (FH - 0.18) / 2, cz));
                [1, 2].forEach(f => S(B(w, 0.18, d), slabM, cx, lv(f) - 0.09, cz));
                S(B(w, FH, d), wall, cx, lv(2) + FH / 2, cz);
                S(B(w + 0.3, 0.2, d + 0.3), accent, cx, roofTop + 0.1, cz);
            };
            block(-12, -8.8, -7, -1.2);     // 左棟北 3 間教室
            block(-12, -8.8, 1.2, 7);       // 左棟南 3 間教室
            block(8.8, 12, -6.5, 0);        // 右縱向棟 3 間教室 (上 2 小 + 下 1 大)
            block(2.9, 12, 3.8, 7);         // 右下橫向棟 1 間大教室

            // ---- 教室外走廊 (1~3 樓，有屋頂) ----
            const corr = (x0, x1, z0, z1, roof, mat) => {
                const w = x1 - x0, d = z1 - z0, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
                S(B(w, PL, d), plinthM, cx, PL / 2, cz);
                [1, 2].forEach(f => S(B(w, 0.18, d), mat || slabM, cx, lv(f) - 0.09, cz));

            };
            corr(-8.8, -7.2, -7, 7, true);          // 左棟 東側走廊
            corr(7.2, 8.8, -6.5, 2.2, true);        // 右縱向棟 西側走廊
            corr(2.9, 12, 2.2, 3.8, true);          // 右橫向棟 北側走廊
            corr(-7.2, 2.9, 2.2, 4.4, false, bridgeM);   // 1-3 樓連通走道 (3 樓沒屋頂)

            const pil = (x, z) => S(new THREE.CylinderGeometry(0.09, 0.1, roofTop - PL, 10), col, x, PL + (roofTop - PL) / 2, z);
            [-6.8, -5.0, -3.2, -1.4, 0.4, 5.2, 6.8].forEach(z => pil(-7.35, z));
            [-6.3, -4.5, -2.7, -0.9, 0.9].forEach(z => pil(7.35, z));
            [3.2, 5.0, 6.8].forEach(x => pil(x, 2.35));
            [-6.6, -3.6, 2.6].forEach(x => [2.35, 4.25].forEach(z => S(new THREE.CylinderGeometry(0.1, 0.11, lv(2) - PL, 10), col, x, PL + (lv(2) - PL) / 2, z)));   // 連通走道支柱 (1F、2F)

            // ---- 2、3 樓：綠色欄杆 + 透明強化玻璃矮牆 ----
            [1, 2].forEach(f => {
                rail(-7.25, -7, -7.25, 2.2, f); rail(-7.25, 4.4, -7.25, 7, f);
                rail(-8.8, -7, -7.25, -7, f); rail(-8.8, 7, -7.25, 7, f);
                rail(7.25, -6.5, 7.25, 2.2, f);
                rail(2.9, 2.25, 7.25, 2.25, f);
                rail(11.95, 2.2, 11.95, 3.8, f);
                rail(-7.25, 2.25, 2.9, 2.25, f); rail(-7.25, 4.35, 2.9, 4.35, f);

            // ---- 教室門窗 ----
            const roomsV = (list, xC, ryC, xB, ryB) => list.forEach(([za, zb]) => {
                const zc = (za + zb) / 2, L = zb - za;
                [0, 1, 2].forEach(f => {

            roomsV([...split(-7, -1.2, 3), ...split(1.2, 7, 3)], -8.77, Math.PI / 2, -12.03, -Math.PI / 2);

            [0, 1, 2].forEach(f => {

            const roofR = new THREE.Group(); roofR.position.set(10.4, 0, -2.15); roofR.rotation.y = -Math.PI / 2; addSolarShedRoof(roofR, 8.7, 3.2, baseY); g.add(roofR);
            const roofH = new THREE.Group(); roofH.position.set(7.45, 0, 5.4); roofH.rotation.y = Math.PI; addSolarShedRoof(roofH, 9.1, 3.2, baseY); g.add(roofH);

            // ---- 1-3 樓樓梯 (左棟中間、右棟南端) 與 1-3 樓旋轉樓梯 (右棟北端) ----

        function createStairTower() {
            const g = new THREE.Group();
            const FH = 1.8, PL = 0.2, lv = f => PL + f * FH;
            const M = (c, r = 0.55) => new THREE.MeshStandardMaterial({ color: c, roughness: r });

                    const b = S(B(sl, 0.1, 0.05), steel, -0.5, L + 0.9 + 0.45, 0.6 + dz); b.rotation.z = -ang;

        function createSpiralStair() {
            const g = new THREE.Group();
            const FH = 1.8, PL = 0.2, lv = f => PL + f * FH, N = 24, rise = 2 * FH / N, dth = 4 * Math.PI / N;
            const M = (c, r = 0.55) => new THREE.MeshStandardMaterial({ color: c, roughness: r });

            for (let t = 0; t <= N; t += 0.5) { const phi = t * dth; pts.push(new THREE.Vector3(Math.sin(phi) * 1.26, PL + rise * t + 0.95, Math.cos(phi) * 1.26)); }
            const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), N * 4, 0.03, 6), rail);
            tube.castShadow = true; g.add(tube);

            return g;
        }

        // --- Create Single Island Structure ---
        // =============== 依平面圖建構建築 (海韻樓 / 舊南棟 / 幼兒園) ===============
        // 平面座標：x 向右(東)、z 向下(南)，單位同場景；各棟生成後再依島嶼方位旋轉。
        // spec: { floors, rooms[{x0,x1,z0,z1,door}], stairs[{...,open}], corridors[{...}], links[{...}], solarRoofs[...] }
        function createPlanBuilding(spec) {
            const g = new THREE.Group();
            const fh = 1.8, F = spec.floors, cf = Math.min(F, 2), H = F * fh;
            const M = (c, r = 0.55) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
            const wallMat = M(spec.wall || 0xF5F5F5), bandMat = M(0xE3DAC9, 0.6), frameMat = M(0xFFFFFF, 0.5), roofMat = M(spec.roof || 0x1976D2, 0.5);
            const slabMat = M(0xD7CCC8, 0.8), corrRoofMat = M(0x1565C0, 0.5), pilMat = M(0xECEFF1, 0.5), doorMat = M(0x5D4037, 0.7), steel = M(0x78909C, 0.45), stepMat = M(0xB0BEC5, 0.6);
            const glass = getGlassMat(), railGlass = getRailMats().glass;
            const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
            const S = (geo, m, x, y, z, parent) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; (parent || g).add(o); return o; };
            const rooms = spec.rooms || [], stairs = spec.stairs || [], corrs = spec.corridors || [], links = spec.links || [];
            const inside = (x, z, list) => list.some(r => x > r.x0 + 0.02 && x < r.x1 - 0.02 && z > r.z0 + 0.02 && z < r.z1 - 0.02);
            const kindAt = (x, z) => (inside(x, z, rooms) || inside(x, z, stairs)) ? 'block' : inside(x, z, corrs) ? 'corr' : inside(x, z, links) ? 'link' : 'out';
            const sideGeom = (r, n) => n[0] === 0
                ? { len: r.x1 - r.x0, pt: t => [r.x0 + t, n[1] < 0 ? r.z0 : r.z1] }
                : { len: r.z1 - r.z0, pt: t => [n[0] < 0 ? r.x0 : r.x1, r.z0 + t] };
            const kindOfSide = (r, n, t) => { const p = sideGeom(r, n).pt(t); return kindAt(p[0] + n[0] * 0.2, p[1] + n[1] * 0.2); };
            const DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];
            const lvl = f => f === 0 ? 0.3 : f * fh;

            const addWindow = (x, z, n, y, sc) => {
                const w = new THREE.Group();
                w.add(new THREE.Mesh(B(0.98 * sc, 0.98, 0.06), frameMat));
                w.add(new THREE.Mesh(B(0.82 * sc, 0.82, 0.09), glass));
                const sill = new THREE.Mesh(B(1.1 * sc, 0.07, 0.18), frameMat); sill.position.y = -0.52; w.add(sill);
                w.position.set(x + n[0] * 0.02, y, z + n[1] * 0.02); w.rotation.y = Math.atan2(n[0], n[1]); g.add(w);
            };
            const addDoor = (x, z, n, y) => {
                const d = new THREE.Mesh(B(0.8, 1.2, 0.07), doorMat);
                d.position.set(x + n[0] * 0.04, y, z + n[1] * 0.04); d.rotation.y = Math.atan2(n[0], n[1]); d.castShadow = true; g.add(d);
            };

            // ---- 教室 ----
            rooms.forEach(r => {
                const w = r.x1 - r.x0, d = r.z1 - r.z0, cx = (r.x0 + r.x1) / 2, cz = (r.z0 + r.z1) / 2;
                S(B(w + 0.3, 0.3, d + 0.3), bandMat, cx, 0.15, cz);
                for (let f = 0; f < F; f++) {
                    S(B(w, fh, d), wallMat, cx, f * fh + fh / 2, cz);
                    if (f > 0) S(B(w + 0.2, 0.14, d + 0.2), bandMat, cx, f * fh, cz);
                }
                S(B(w + 0.3, 0.26, d + 0.3), roofMat, cx, H + 0.13, cz);
                const kinds = DIRS.map(n => kindOfSide(r, n, sideGeom(r, n).len / 2));
                let doorN = r.door || null;
                if (!doorN) { const i = kinds.indexOf('corr'); if (i >= 0) doorN = DIRS[i]; }
                DIRS.forEach((n, i) => {
                    if (kinds[i] === 'block') return;
                    const sg = sideGeom(r, n), isDoorSide = doorN && doorN[0] === n[0] && doorN[1] === n[1];
                    for (let f = 0; f < F; f++) {
                        const wy = f * fh + fh / 2 + 0.1;
                        if (isDoorSide) {
                            const p1 = sg.pt(sg.len * 0.27), p2 = sg.pt(sg.len * 0.73), sc = Math.max(0.55, Math.min(1, sg.len * 0.38 / 0.98));
                            if (f < cf) addDoor(p1[0], p1[1], n, (f === 0 ? 0.3 : f * fh) + 0.7); else addWindow(p1[0], p1[1], n, wy, sc);
                            addWindow(p2[0], p2[1], n, wy, sc);
                        } else {
                            const k = Math.max(1, Math.floor(sg.len / 1.6)), sc = Math.min(1, (sg.len / k) * 0.7 / 0.98);
                            for (let j = 0; j < k; j++) { const p = sg.pt(sg.len * (j + 0.5) / k); addWindow(p[0], p[1], n, wy, sc); }
                        }
                    }
                });
            });

            // ---- 樓梯間 (玻璃牆 + 折返梯) ----
            stairs.forEach(s => {
                const w = s.x1 - s.x0, d = s.z1 - s.z0, cx = (s.x0 + s.x1) / 2, cz = (s.z0 + s.z1) / 2;
                S(B(w + 0.3, 0.3, d + 0.3), bandMat, cx, 0.15, cz);
                S(B(w + 0.3, 0.26, d + 0.3), roofMat, cx, H + 0.13, cz);
                const od = s.open, alongZ = od[0] === 0, Ld = alongZ ? d : w, Wd = alongZ ? w : d;
                const sg = new THREE.Group(); sg.position.set(cx, 0, cz); sg.rotation.y = Math.atan2(od[0], od[1]); g.add(sg);   // 局部 +z = 開口(走廊)方向
                S(B(Wd - 0.1, H, 0.05), railGlass, 0, H / 2, -Ld / 2 + 0.05, sg).castShadow = false;
                [-1, 1].forEach(sx => S(B(0.05, H, Ld - 0.1), railGlass, sx * (Wd / 2 - 0.05), H / 2, 0, sg).castShadow = false);
                [-1, 1].forEach(sx => [-1, 1].forEach(sz => S(new THREE.CylinderGeometry(0.07, 0.08, H, 8), steel, sx * (Wd / 2 - 0.06), H / 2, sz * (Ld / 2 - 0.06), sg)));
                for (let f = 0; f < F - 1; f++) {
                    const y0 = lvl(f), y1 = lvl(f + 1), half = (y1 - y0) / 2, rs = half / 6;
                    const LD = Math.min(0.8, Ld * 0.28), fl = Ld - LD - 0.1, sd = fl / 6, sw = Wd / 2 - 0.12;
                    for (let i = 0; i < 6; i++) S(B(sw, 0.07, sd), stepMat, -Wd / 4, y0 + rs * (i + 1) - 0.035, Ld / 2 - sd * (i + 0.5), sg);
                    S(B(Wd - 0.14, 0.1, LD), slabMat, 0, y0 + half - 0.05, -Ld / 2 + LD / 2 + 0.05, sg);
                    for (let i = 0; i < 6; i++) S(B(sw, 0.07, sd), stepMat, Wd / 4, y0 + half + rs * (i + 1) - 0.035, -Ld / 2 + LD + sd * (i + 0.5), sg);
                }
            });

            // ---- 教室外走廊 (1~2 樓，有屋頂；2 樓設綠色欄杆 + 透明強化玻璃矮牆) ----
            corrs.forEach(c => {
                const w = c.x1 - c.x0, d = c.z1 - c.z0, cx = (c.x0 + c.x1) / 2, cz = (c.z0 + c.z1) / 2;

            });
            const ph = cf * fh - 0.3;
            corrs.forEach(c => DIRS.forEach(n => {

            (spec.solarRoofs || []).forEach(sr => {

        }

        const planRect = (P, x0, y0, x1, y1, extra) => { const a = P(x0, y0), b = P(x1, y1); return Object.assign({ x0: a[0], z0: a[1], x1: b[0], z1: b[1] }, extra || {}); };

        // ---- 海韻樓 (依「海韻樓」圖：「」」型，右側縱向棟 4 間教室 + 樓梯，下方橫向棟 1 間大教室 + 樓梯) ----

        }

        function createConnectingBridge(x1, y1, z1, x2, y2, z2, subRadius, subId, ov) {

        // --- Build Campus Islands Layout + 步行路網 ---
        function buildCampusIslands() {

            const subs = campusData.filter(d => !d.isMain), numSub = subs.length, orbit = 44;
            const bridgeNodes = [], subNodes = {}, infos = {}, guardPatrol = [];
            const posOf = i => { const a = Math.PI / 2 + i / numSub * Math.PI * 2; return [Math.cos(a) * orbit, Math.sin(a) * orbit]; };
            const idxOf = id => subs.findIndex(s => s.id === id);

            }
            const addFoam = (g, r) => {
                const m = new THREE.Mesh(new THREE.RingGeometry(r + 0.4, r + 1.6, 64), new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }));

            };

            subs.forEach((data, index) => {
                const angle = Math.PI / 2 + index / numSub * Math.PI * 2;
                const x = Math.cos(angle) * orbit, z = Math.sin(angle) * orbit, y = Math.sin(index * 1.5) * 0.4;

                }

                const bi = bridgesInfo[bridgesInfo.length - 1];

                const rn = ring[Math.round(angle / (Math.PI * 2) * RN) % RN];
                addDisc(mainG, rn.p.x, rn.p.z, 2.0);
                let prev = rn; const chain = [rn];
                {   // 主島內部道路：由環形道路通到主島邊緣，再接橋梁
                    const ex = bi.pStart.x - rn.p.x, ez = bi.pStart.z - rn.p.z, m = Math.max(1, Math.ceil(Math.hypot(ex, ez) / 2.5));
                    addRoad(mainG, rn.p.x, rn.p.z, bi.pStart.x, bi.pStart.z, 1.8);

                const r = data.radius, court = data.isPlayground || data.isTennis;

                    const w1 = nH(400, 430), w2 = nH(385, 247), w3 = nH(420, 120), h1 = nH(520, 108), f1 = nH(600, 100), plz = nH(672, 48);
                    const a1 = nH(470, 505), b1 = nH(600, 505), c1 = nH(610, 400), d1 = nH(618, 300), e1 = nH(620, 170);
                    link(endNode, w1, 0.45); link(w1, a1, 0.45); link(a1, b1, 0.45); link(b1, c1, 0.45); link(c1, d1, 0.45); link(d1, e1, 0.45); link(e1, f1, 0.45);
                    link(w1, w2, 0.45); link(w2, w3, 0.45); link(w3, h1, 0.45); link(h1, f1, 0.45); link(f1, plz, 0.45);
                    [[endNode, w1], [w1, a1], [a1, b1], [b1, c1], [w1, w2], [w2, w3]].forEach(([p, q]) => addRoad(g, p.p.x, p.p.z, q.p.x, q.p.z, 1.2));
                    mine.push(w1, w2, w3, h1, f1, plz, a1, b1, c1, d1, e1);

                    const pp = new THREE.Vector3(x, 0, z).addScaledVector(u, r * 0.66);
                    const plaza = mkNode(pp.x, 0, pp.z, g);

                    const sl = mkNode(pp.x + v.x * lat, 0, pp.z + v.z * lat, g), sr = mkNode(pp.x - v.x * lat, 0, pp.z - v.z * lat, g);

                    const nd = (cx, cy) => { const p = L(cx, cy); return mkNode(p[0], 0, p[1], g); };
                    const X0 = 25, X1 = 487, Y0 = 25, Y1 = 301, RR = 81, pts0 = [];

                        const m = Math.floor(Math.hypot(q[0] - p[0], q[1] - p[1]) / 62);
                        for (let k = 1; k <= m; k++) pts.push([p[0] + (q[0] - p[0]) * k / (m + 1), p[1] + (q[1] - p[1]) * k / (m + 1)]);
                    });
                    const trk = pts.map(p => { const w = L(p[0], p[1]); return mkNode(w[0], 0, w[1], g); });
                    trk.forEach((n, i) => link(n, trk[(i + 1) % trk.length], 0.45));

        }

        // --- Interaction Handlers ---
        // --- 浮動按鈕：平移 / 旋轉 (擇一，以滑鼠右鍵操作) 與 放大 / 縮小 ---
        function setNavMode(mode) {
            if (!controls) return;
            controls.mouseButtons = { LEFT: -1, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: mode === 'pan' ? THREE.MOUSE.PAN : THREE.MOUSE.ROTATE };
            if (THREE.TOUCH) controls.touches = { ONE: mode === 'pan' ? THREE.TOUCH.PAN : THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
            const on = 'bg-blue-600 text-white shadow-md', off = 'text-slate-600 hover:bg-white/60';
            [['rotate', 'nav-rotate'], ['pan', 'nav-pan']].forEach(([m, id]) => {
                const el = document.getElementById(id); if (!el) return;
                el.className = 'nav-btn px-3 py-2 rounded-xl text-xs md:text-sm font-black transition-all flex items-center gap-1 ' + (m === mode ? on : off);
            });
        }
        function zoomCamera(f) {
            const v = camera.position.clone().sub(controls.target);
            v.setLength(Math.min(controls.maxDistance, Math.max(controls.minDistance, v.length() * f)));
            camera.position.copy(controls.target).add(v);
            controls.update();
        }
        let zoomTimer = null;
        function stopZoom() { if (zoomTimer) { clearInterval(zoomTimer); zoomTimer = null; } }
        function startZoom(dir) {
            stopZoom();
            zoomCamera(dir > 0 ? 0.92 : 1.08);
            zoomTimer = setInterval(() => zoomCamera(dir > 0 ? 0.975 : 1.025), 40);
        }

        function onPointerDown(event) {
            if (event.button !== undefined && event.button !== 0) return;   // 僅左鍵點擊開啟介紹
            if (event.target !== renderer.domElement) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            for (let i = 0; i < intersects.length; i++) {
                let obj = intersects[i].object;
                while (obj && !obj.userData.id && obj.parent) {
                    obj = obj.parent;
                }
                if (obj && obj.userData && obj.userData.id) {
                    openModal(obj.userData.id);
                    break;
                }
            }
        }

        function onPointerMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            let hoveredIslandId = null;
            for (let i = 0; i < intersects.length; i++) {
                let obj = intersects[i].object;
                while (obj && !obj.userData.id && obj.parent) {
                    obj = obj.parent;
                }
                if (obj && obj.userData && obj.userData.id) {
                    hoveredIslandId = obj.userData.id;
                    break;
                }
            }

            islands.forEach(island => {
                if (island.userData.id === hoveredIslandId) {
                    island.userData.targetScale = 1.04;
                } else {
                    island.userData.targetScale = 1.0;
                }
            });

            document.body.style.cursor = hoveredIslandId ? 'pointer' : 'default';
        }

        // --- Modal Dialog Functions ---
        function openModal(islandId) {
            const data = campusData.find(d => d.id === islandId);
            if (!data) return;

            document.getElementById('modal-title').innerText = data.name;
            document.getElementById('modal-desc').innerText = data.desc;

            // Handle direct link for island title (e.g. 幼兒園)
            const titleLinkContainer = document.getElementById('modal-title-link');
            const islandUrl = officeLinks[data.name] || officeLinks[data.name.replace(/\s*\(.*?\)/g, '')];
            if (islandUrl) {
                titleLinkContainer.innerHTML = `
                    <a href="${islandUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-xs font-bold rounded-xl shadow-md hover:shadow-lg transition-all hover:scale-105">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                        <span>前往專頁 ↗</span>
                    </a>
                `;
            } else {
                titleLinkContainer.innerHTML = '';
            }

            const facilitiesContainer = document.getElementById('modal-facilities');
            facilitiesContainer.innerHTML = '';

            if (data.facilities) {
                Object.entries(data.facilities).forEach(([category, items]) => {
                    const catTitle = document.createElement('div');
                    catTitle.className = 'col-span-full font-bold text-xs text-blue-700 bg-blue-100/70 px-3 py-1 rounded-lg mt-1';
                    catTitle.innerText = category;
                    facilitiesContainer.appendChild(catTitle);

                    items.forEach(item => {
                        const linkUrl = officeLinks[item];
                        if (linkUrl) {
                            const linkCard = document.createElement('a');
                            linkCard.href = linkUrl;
                            linkCard.target = '_blank';
                            linkCard.rel = 'noopener noreferrer';
                            linkCard.className = 'p-2.5 bg-gradient-to-r from-blue-50 to-indigo-50 hover:from-blue-100 hover:to-indigo-100 rounded-xl border border-blue-300 shadow-sm flex items-center justify-between text-xs md:text-sm text-blue-900 font-bold transition-all hover:scale-[1.02] hover:shadow-md group';
                            linkCard.innerHTML = `
                                <div class="flex items-center space-x-2">
                                    <span class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></span>
                                    <span>${item}</span>
                                </div>
                                <span class="inline-flex items-center gap-1 text-xs text-blue-600 group-hover:text-blue-800 font-extrabold bg-white/80 px-2 py-0.5 rounded-md border border-blue-200">
                                    前往網頁 ↗
                                </span>
                            `;
                            facilitiesContainer.appendChild(linkCard);
                        } else {
                            const itemCard = document.createElement('div');
                            itemCard.className = 'p-2.5 bg-white/80 rounded-xl border border-slate-200/80 shadow-sm flex items-center space-x-2 text-xs md:text-sm text-slate-800 font-medium hover:bg-blue-50 transition-colors';
                            itemCard.innerHTML = `
                                <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                                <span>${item}</span>
                            `;
                            facilitiesContainer.appendChild(itemCard);
                        }
                    });
                });
            }

            const modal = document.getElementById('info-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.children[0].classList.remove('scale-95');
            modal.children[0].classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('info-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.children[0].classList.remove('scale-100');
            modal.children[0].classList.add('scale-95');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Main Scene Initialization ---
        function init() {
            const dateEl = document.getElementById('current-date');
            const now = new Date();
            const daysOfWeek = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dayName = daysOfWeek[now.getDay()];
            dateEl.innerText = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} (${dayName})`;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.006);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 62, 98);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.05;
            controls.minDistance = 15;
            controls.maxDistance = 200;
            controls.target.set(0, 0, 0);
            setNavMode('rotate');
            [['zoom-in', 1], ['zoom-out', -1]].forEach(([id, d]) => {
                const b = document.getElementById(id);
                b.addEventListener('pointerdown', e => { e.preventDefault(); startZoom(d); });
                ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stopZoom));
            });

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            labelsContainer = document.getElementById('labels-container');

            setupLighting();
            createOcean();
            createClouds();
            buildCampusIslands();

            setLightingMode('realtime');

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);

            document.getElementById('close-modal').addEventListener('click', closeModal);
            document.getElementById('modal-ok-btn').addEventListener('click', closeModal);

            animate();
        }

        // --- Render Loop ---
        const clock = new THREE.Clock();
        let lastT = 0;
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            swingList.forEach(s => { s.rotation.x = Math.sin(elapsedTime * 1.6 + s.userData.ph) * 0.35; });

            controls.update();

            if (waterMesh) {
                const pos = waterMesh.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const u = pos.getX(i);
                    const v = pos.getY(i);
                    const z = Math.sin(elapsedTime * 1.5 + u * 0.2) * 0.25 + Math.cos(elapsedTime * 1.2 + v * 0.2) * 0.25;
                    pos.setZ(i, z);
                }
                waterMesh.geometry.computeVertexNormals();
                waterMesh.geometry.attributes.position.needsUpdate = true;
            }

            if (cloudsGroup) {
                cloudsGroup.rotation.y = elapsedTime * 0.02;
            }

            islands.forEach(group => {
                const off = group.userData.floatOffset;
                group.position.y = group.userData.baseY + Math.sin(elapsedTime * 1.2 + off) * 0.1;

                group.userData.currentScale += (group.userData.targetScale - group.userData.currentScale) * 0.1;
                group.scale.setScalar(group.userData.currentScale);

                if (group.userData.labelEl) {
                    const worldPos = group.position.clone();
                    worldPos.y += group.userData.radius * 0.35 + 3.8;

                    const camSpacePos = worldPos.clone().applyMatrix4(camera.matrixWorldInverse);
                    const labelEl = group.userData.labelEl;

                    if (camSpacePos.z < 0) {
                        const ndc = worldPos.clone().project(camera);

                        if (ndc.x >= -1.1 && ndc.x <= 1.1 && ndc.y >= -1.1 && ndc.y <= 1.1) {
                            const x = (ndc.x * 0.5 + 0.5) * window.innerWidth;
                            const y = (-(ndc.y * 0.5) + 0.5) * window.innerHeight;

                            labelEl.style.display = 'flex';
                            labelEl.style.left = `${x}px`;
                            labelEl.style.top = `${y}px`;
                            labelEl.style.opacity = '1';
                        } else {
                            labelEl.style.display = 'none';
                        }
                    } else {
                        labelEl.style.display = 'none';
                    }
                }
            });

            const dt = Math.min(elapsedTime - lastT, 0.05); lastT = elapsedTime;
            characters.forEach(char => char.update(dt));
            treeList.forEach(o => { const c = o.tree.userData.crown; if (c) { c.rotation.z = Math.sin(elapsedTime * 0.9 + o.phase) * 0.025; c.rotation.x = Math.cos(elapsedTime * 0.7 + o.phase) * 0.015; } });
            foamRings.forEach(f => { const s = 1 + Math.sin(elapsedTime * 1.4 + f.phase) * 0.035; f.m.scale.set(s, s, 1); f.m.material.opacity = 0.28 + Math.sin(elapsedTime * 1.4 + f.phase) * 0.1; });
            if (cloudsGroup) cloudsGroup.children.forEach(c => { c.position.y += Math.sin(elapsedTime * 0.4 + c.userData.phase) * 0.003; });

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
